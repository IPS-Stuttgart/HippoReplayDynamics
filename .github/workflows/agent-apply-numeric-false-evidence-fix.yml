name: Apply numeric false evidence fix

on:
  push:
    branches:
      - agent/preserve-numeric-false-evidence-flags

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Apply focused source and regression changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("src/hipporeplayimm/evidence_status_coercion.py")
          source = source_path.read_text(encoding="utf-8")

          old_import = "from functools import wraps\n"
          new_import = "from decimal import Decimal, InvalidOperation\nfrom functools import wraps\n"
          if source.count(old_import) != 1:
              raise RuntimeError("unexpected functools import layout")
          source = source.replace(old_import, new_import, 1)

          old_helper = '''def _is_explicit_false_value(value: object) -> bool:
              if isinstance(value, (bool, np.bool_)):
                  return not bool(value)
              if _is_missing_scalar(value):
                  return False
              if isinstance(value, (int, np.integer)):
                  return int(value) == 0
              if isinstance(value, (float, np.floating)):
                  numeric = float(value)
                  return bool(np.isfinite(numeric) and numeric == 0.0)
              return str(value).strip().lower() in _EXPLICIT_FALSE_BOOL_VALUES
          '''
          new_helper = '''def _is_explicit_false_value(value: object) -> bool:
              if isinstance(value, (bool, np.bool_)):
                  return not bool(value)
              if _is_missing_scalar(value):
                  return False
              if isinstance(value, (int, np.integer)):
                  return int(value) == 0
              if isinstance(value, (float, np.floating)):
                  numeric = float(value)
                  return bool(np.isfinite(numeric) and numeric == 0.0)

              text = str(value).strip().lower()
              if text in _EXPLICIT_FALSE_BOOL_VALUES:
                  return True
              try:
                  numeric = Decimal(text)
              except (InvalidOperation, ValueError):
                  return False
              return bool(numeric.is_finite() and numeric == 0)
          '''
          if source.count(old_helper) != 1:
              raise RuntimeError("unexpected explicit-false helper layout")
          source_path.write_text(source.replace(old_helper, new_helper, 1), encoding="utf-8")

          test_path = Path("tests/test_evidence_status_numeric_false.py")
          test_path.write_text(
              '''from __future__ import annotations

import pandas as pd
import pytest

from hipporeplayimm.evidence_reporting import (
    EVIDENCE_COMPARISON_UNKNOWN,
    ensure_evidence_support_columns,
)
from hipporeplayimm.evidence_status_coercion import _is_explicit_false_value


@pytest.mark.parametrize("encoded_false", ["0e0", "-0", "+0.000", "0E+999"])
def test_numeric_zero_comparable_flags_remain_noncomparable(encoded_false: str) -> None:
    rows = pd.DataFrame(
        [
            {
                "status": "success",
                "model": "legacy-candidate-pruned-row",
                "log_evidence": 100.0,
                "evidence_comparable": encoded_false,
            }
        ]
    )

    scored = ensure_evidence_support_columns(rows)

    assert scored.loc[0, "evidence_support"] == EVIDENCE_COMPARISON_UNKNOWN
    assert not bool(scored.loc[0, "evidence_comparable"])
    assert scored.loc[0, "evidence_comparison"] == EVIDENCE_COMPARISON_UNKNOWN


def test_numeric_false_detection_does_not_underflow_tiny_nonzero_strings() -> None:
    assert not _is_explicit_false_value("1e-4000")
''',
              encoding="utf-8",
          )

          Path(".github/workflows/agent-apply-numeric-false-evidence-fix.yml").unlink()
          PY

      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Run focused tests and lint
        run: |
          python -m pytest -q \
            tests/test_evidence_status_numeric_false.py \
            tests/test_evidence_reporting.py
          python -m ruff check \
            src/hipporeplayimm/evidence_status_coercion.py \
            tests/test_evidence_status_numeric_false.py

      - name: Commit validated fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Preserve numeric false evidence flags'
          git push origin HEAD:${GITHUB_REF_NAME}
