name: Apply encoding speed fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/fix-encoding-speed-irregular-time'
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Apply focused source fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("src/hipporeplayimm/encoding.py")
          source = source_path.read_text(encoding="utf-8")
          old = '''def _speed_cm_s(times: np.ndarray, xy: np.ndarray) -> np.ndarray:
              if times.shape[0] < 2:
                  return np.zeros(times.shape, dtype=float)
              dt = np.gradient(times)
              dx = np.gradient(xy[:, 0])
              dy = np.gradient(xy[:, 1])
              with np.errstate(divide="ignore", invalid="ignore"):
                  speed = np.sqrt(dx * dx + dy * dy) / dt
              return np.nan_to_num(speed, nan=0.0, posinf=0.0, neginf=0.0)
          '''
          new = '''def _speed_cm_s(times: np.ndarray, xy: np.ndarray) -> np.ndarray:
              if times.shape[0] < 2:
                  return np.zeros(times.shape, dtype=float)
              with np.errstate(divide="ignore", invalid="ignore"):
                  dx = np.gradient(xy[:, 0], times)
                  dy = np.gradient(xy[:, 1], times)
                  speed = np.sqrt(dx * dx + dy * dy)
              return np.nan_to_num(speed, nan=0.0, posinf=0.0, neginf=0.0)
          '''
          if source.count(old) != 1:
              raise RuntimeError("expected exactly one encoding speed implementation to patch")
          source_path.write_text(source.replace(old, new, 1), encoding="utf-8")

          regression = Path("tests/test_encoding_nonuniform_speed.py").read_text(
              encoding="utf-8"
          )
          if "test_speed_uses_nonuniform_timestamp_coordinates" not in regression:
              raise RuntimeError("expected nonuniform-timestamp regression is missing")
          PY

      - name: Compile modified source and regression
        run: |
          python -m py_compile src/hipporeplayimm/encoding.py tests/test_encoding_nonuniform_speed.py

      - name: Commit focused fix
        shell: bash
        run: |
          rm .github/workflows/agent-fix-encoding-speed.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hipporeplayimm/encoding.py tests/test_encoding_nonuniform_speed.py .github/workflows/agent-fix-encoding-speed.yml
          git commit -m "Fix encoding speed for irregular timestamps"
          git push origin HEAD:"${GITHUB_HEAD_REF}"
