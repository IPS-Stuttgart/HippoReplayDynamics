name: Apply SleepPOST speed fix

on:
  push:
    branches:
      - agent/fix-sleeppost-speed-irregular-time

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-sleeppost-speed-irregular-time
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply focused source and test changes
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("scripts/summarize_olafsdottir_sleeppost_event_detection_qc.py")
          source = source_path.read_text(encoding="utf-8")
          old = '''        dt = np.gradient(position.times_s)
                  with np.errstate(divide="ignore", invalid="ignore"):
                      vx = np.gradient(filled[:, 0]) / dt
                      vy = np.gradient(filled[:, 1]) / dt
          '''
          new = '''        with np.errstate(divide="ignore", invalid="ignore"):
                      vx = np.gradient(filled[:, 0], position.times_s)
                      vy = np.gradient(filled[:, 1], position.times_s)
          '''
          if source.count(old) != 1:
              raise RuntimeError("expected exactly one SleepPOST speed implementation to patch")
          source_path.write_text(source.replace(old, new, 1), encoding="utf-8")

          test_path = Path("tests/test_olafsdottir_sleeppost_event_detection_qc.py")
          tests = test_path.read_text(encoding="utf-8")
          test_name = "test_sleeppost_speed_uses_nonuniform_timestamp_coordinates"
          if test_name in tests:
              raise RuntimeError("regression test already exists")
          marker = "def _write_sleep_session(day_dir: Path, stem: str, tetrode: int) -> None:"
          addition = '''def test_sleeppost_speed_uses_nonuniform_timestamp_coordinates(tmp_path: Path, monkeypatch) -> None:
              module = _load_module()
              sleep_stem = tmp_path / "sleep"
              sleep_stem.with_suffix(".pos").touch()
              times = np.array([0.0, 1.0, 3.0])

              class Position:
                  pass

              position = Position()
              position.x_cm = times**2
              position.y_cm = np.zeros_like(times)
              position.valid = np.ones(times.shape, dtype=bool)
              position.times_s = times
              monkeypatch.setattr(module, "read_axona_pos", lambda _path: position)

              speed = module.load_sleep_speed(sleep_stem)

              assert speed is not None
              np.testing.assert_allclose(speed.speed_cm_s, np.array([1.0, 2.0, 4.0]))


'''
          if tests.count(marker) != 1:
              raise RuntimeError("expected exactly one helper insertion point")
          test_path.write_text(tests.replace(marker, addition + marker, 1), encoding="utf-8")
          PY
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run focused regression
        run: python -m pytest -q tests/test_olafsdottir_sleeppost_event_detection_qc.py
      - name: Run static checks
        run: |
          python -m ruff check scripts/summarize_olafsdottir_sleeppost_event_detection_qc.py tests/test_olafsdottir_sleeppost_event_detection_qc.py
          python -m py_compile scripts/summarize_olafsdottir_sleeppost_event_detection_qc.py tests/test_olafsdottir_sleeppost_event_detection_qc.py
      - name: Commit validated fix
        run: |
          rm .github/workflows/agent-fix-sleeppost-speed.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/summarize_olafsdottir_sleeppost_event_detection_qc.py tests/test_olafsdottir_sleeppost_event_detection_qc.py .github/workflows/agent-fix-sleeppost-speed.yml
          git commit -m "Fix SleepPOST speed for irregular timestamps"
          git push
