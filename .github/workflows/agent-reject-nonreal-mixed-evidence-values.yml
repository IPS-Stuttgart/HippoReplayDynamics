name: Apply non-real mixed evidence fix

on:
  push:
    branches:
      - agent/reject-nonreal-mixed-evidence-values

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/reject-nonreal-mixed-evidence-values
          fetch-depth: 0

      - name: Apply focused fix and regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("src/hipporeplayimm/result_quality_audit_scope_patch.py")
          source = source_path.read_text(encoding="utf-8")
          old = '''def _coerce_evidence_numeric_scalar(value: object) -> float:
              """Coerce one evidence value with the base helper's numeric semantics."""

              try:
                  return float(value)
              except (TypeError, ValueError, OverflowError):
                  return float("nan")


          def _coerce_evidence_numeric_series(values: pd.Series) -> pd.Series:
              """Match legacy evidence coercion while tolerating pathological objects."""

              try:
                  return pd.to_numeric(values, errors="coerce")
              except (TypeError, ValueError, OverflowError):
                  return values.map(_coerce_evidence_numeric_scalar).astype(float)
          '''
          old = "\n".join(line[10:] if line.startswith("          ") else line for line in old.splitlines())
          new = '''def _coerce_evidence_numeric_scalar(value: object) -> float:
              """Coerce one real scalar evidence value without lossy NumPy conversion."""

              seen_container_ids: set[int] = set()
              while isinstance(value, np.ndarray):
                  if value.ndim != 0:
                      return float("nan")
                  container_id = id(value)
                  if container_id in seen_container_ids:
                      return float("nan")
                  seen_container_ids.add(container_id)
                  value = value.item()

              if isinstance(value, (bool, np.bool_, complex, np.complexfloating)):
                  return float("nan")
              if isinstance(value, np.generic):
                  value = value.item()
                  if isinstance(value, (bool, complex)):
                      return float("nan")
              try:
                  return float(value)
              except (TypeError, ValueError, OverflowError):
                  return float("nan")


          def _coerce_evidence_numeric_series(values: pd.Series) -> pd.Series:
              """Coerce only scalar real evidence values, preserving malformed rows as NaN."""

              return values.map(_coerce_evidence_numeric_scalar).astype(float)
          '''
          new = "\n".join(line[10:] if line.startswith("          ") else line for line in new.splitlines())
          if old not in source:
              raise SystemExit("expected mixed-evidence coercion block not found")
          source_path.write_text(source.replace(old, new, 1), encoding="utf-8")

          test_path = Path("tests/test_result_quality_audit_mixed_evidence.py")
          tests = test_path.read_text(encoding="utf-8")
          test_name = "test_mixed_evidence_rejects_boolean_and_complex_scalars"
          addition = '''

          def test_mixed_evidence_rejects_boolean_and_complex_scalars() -> None:
              nested_complex = np.empty((), dtype=object)
              nested_complex[()] = np.clongdouble(5.0 + 0.25j)
              scores = pd.DataFrame(
                  {
                      "log_evidence": [
                          True,
                          np.bool_(False),
                          2.0 + 0.0j,
                          np.complex128(3.0 + 0.5j),
                          np.clongdouble(4.0 + 0.0j),
                          nested_complex,
                          6.0,
                      ],
                      "heldout_log_likelihood": [np.nan] * 7,
                  }
              )

              scored = ensure_evidence_support_columns(scores)

              assert scored["evidence_comparable"].tolist() == [
                  False,
                  False,
                  False,
                  False,
                  False,
                  False,
                  True,
              ]
          '''
          addition = "\n".join(line[10:] if line.startswith("          ") else line for line in addition.splitlines())
          if test_name not in tests:
              test_path.write_text(tests.rstrip() + addition + "\n", encoding="utf-8")
          PY

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run focused validation
        run: |
          python -m py_compile \
            src/hipporeplayimm/result_quality_audit_scope_patch.py \
            tests/test_result_quality_audit_mixed_evidence.py
          python -W error -m pytest -q tests/test_result_quality_audit_mixed_evidence.py

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm .github/workflows/agent-reject-nonreal-mixed-evidence-values.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hipporeplayimm/result_quality_audit_scope_patch.py \
            tests/test_result_quality_audit_mixed_evidence.py \
            .github/workflows/agent-reject-nonreal-mixed-evidence-values.yml
          git commit -m "Reject non-real mixed evidence values"
          git push origin HEAD:agent/reject-nonreal-mixed-evidence-values
