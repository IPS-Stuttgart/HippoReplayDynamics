name: Apply ground-truth model hyperparameter fix

on:
  push:
    branches:
      - fix/ground-truth-model-hyperparams-run

permissions:
  contents: write

jobs:
  apply-fix:
    if: ${{ !contains(github.event.head_commit.message, 'Preserve model hyperparameters for ground-truth decoding') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Apply model-hyperparameter reconstruction patch
        run: |
          python - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          patch_b64 = """
          
          """
          patch = gzip.decompress(base64.b64decode("".join(patch_b64.split())))
          Path("/tmp/ground_truth_model_hyperparams.patch").write_bytes(patch)
          PY
          git apply /tmp/ground_truth_model_hyperparams.patch
      - name: Run focused tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pandas h5py beartype pytest
          PYTHONPATH=src pytest tests/test_benchmarks.py tests/test_ground_truth.py
      - name: Commit source changes
        run: |
          git config user.name "ChatGPT Connector"
          git config user.email "actions@github.com"
          git rm .github/workflows/apply-ground-truth-model-hyperparams-fix.yml
          git add src/hipporeplayimm/benchmarks.py src/hipporeplayimm/ground_truth.py scripts/benchmark_model_evidence.py src/hipporeplayimm/cli.py tests/test_benchmarks.py tests/test_ground_truth.py
          git commit -m "Preserve model hyperparameters for ground-truth decoding"
          git push origin HEAD:main
