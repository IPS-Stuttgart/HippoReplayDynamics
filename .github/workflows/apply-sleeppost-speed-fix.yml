name: Apply SleepPOST irregular-speed fix

on:
  push:
    branches:
      - agent/fix-sleeppost-irregular-speed
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-sleeppost-irregular-speed
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Apply source fix and regression test
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("scripts/summarize_olafsdottir_sleeppost_event_detection_qc.py")
          source = source_path.read_text(encoding="utf-8")
          old = '''        dt = np.gradient(position.times_s)
          with np.errstate(divide="ignore", invalid="ignore"):
              vx = np.gradient(filled[:, 0]) / dt
              vy = np.gradient(filled[:, 1]) / dt
          '''
          new = '''        with np.errstate(divide="ignore", invalid="ignore"):
              vx = np.gradient(filled[:, 0], position.times_s)
              vy = np.gradient(filled[:, 1], position.times_s)
          '''
          if source.count(old) != 1:
              raise SystemExit("expected exactly one SleepPOST speed block")
          source_path.write_text(source.replace(old, new), encoding="utf-8")

          test_path = Path("tests/test_olafsdottir_sleeppost_event_detection_qc.py")
          tests = test_path.read_text(encoding="utf-8")
          test_name = "test_load_sleep_speed_uses_irregular_timestamps"
          if test_name not in tests:
              marker = "\n\ndef _write_sleep_session(day_dir: Path, stem: str, tetrode: int) -> None:\n"
              regression = '''

          def test_load_sleep_speed_uses_irregular_timestamps(tmp_path: Path, monkeypatch) -> None:
              module = _load_module()
              times = np.asarray([0.0, 1.0, 3.0], dtype=float)
              position = type(
                  "Position",
                  (),
                  {
                      "x_cm": times * times,
                      "y_cm": np.zeros_like(times),
                      "times_s": times,
                      "valid": np.ones(times.shape, dtype=bool),
                  },
              )()
              sleep_stem = tmp_path / "sleep"
              sleep_stem.with_suffix(".pos").touch()
              monkeypatch.setattr(module, "read_axona_pos", lambda _path: position)

              speed = module.load_sleep_speed(sleep_stem)

              assert speed is not None
              np.testing.assert_allclose(speed.speed_cm_s, np.asarray([1.0, 2.0, 4.0]))
          '''
              if marker not in tests:
                  raise SystemExit("test insertion marker not found")
              test_path.write_text(tests.replace(marker, regression + marker), encoding="utf-8")
          PY

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run focused regression tests
        run: python -m pytest -q tests/test_olafsdottir_sleeppost_event_detection_qc.py

      - name: Commit validated patch
        run: |
          rm .github/workflows/apply-sleeppost-speed-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/summarize_olafsdottir_sleeppost_event_detection_qc.py tests/test_olafsdottir_sleeppost_event_detection_qc.py .github/workflows/apply-sleeppost-speed-fix.yml
          git commit -m "Fix SleepPOST speed for irregular timestamps"
          git push origin HEAD:agent/fix-sleeppost-irregular-speed
