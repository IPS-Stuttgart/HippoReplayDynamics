name: Apply SWR exclusion padding fix

on:
  push:
    branches:
      - agent/reject-invalid-swr-padding-20260804

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply validation and regression tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("scripts/spike_matched_event_window_null.py")
          source = source_path.read_text(encoding="utf-8")
          old = '''def _padded_intervals(intervals: np.ndarray, *, padding_s: float) -> np.ndarray:
              arr = np.asarray(intervals, dtype=float).reshape(-1, 2)
              if arr.size == 0:
                  return np.empty((0, 2), dtype=float)
              out = arr.copy()
              out[:, 0] -= float(padding_s)
              out[:, 1] += float(padding_s)
              return out
          '''
          new = '''def _padded_intervals(intervals: np.ndarray, *, padding_s: float) -> np.ndarray:
              padding = float(padding_s)
              if not np.isfinite(padding) or padding < 0.0:
                  raise ValueError("padding_s must be finite and nonnegative")
              arr = np.asarray(intervals, dtype=float).reshape(-1, 2)
              if arr.size == 0:
                  return np.empty((0, 2), dtype=float)
              out = arr.copy()
              out[:, 0] -= padding
              out[:, 1] += padding
              return out
          '''
          if old not in source:
              raise SystemExit("target _padded_intervals implementation not found")
          source_path.write_text(source.replace(old, new, 1), encoding="utf-8")

          test_path = Path("tests/test_swr_exclusion_padding_validation.py")
          test_path.write_text(
              '''from __future__ import annotations

          from pathlib import Path
          from types import SimpleNamespace
          import sys

          import numpy as np
          import pytest

          sys.path.insert(0, str(Path(__file__).resolve().parents[1] / "scripts"))

          from spike_matched_event_window_null import (  # noqa: E402
              _padded_intervals,
              spike_matched_null_windows,
          )


          @pytest.mark.parametrize("padding_s", [-0.01, -np.inf, np.inf, np.nan])
          @pytest.mark.parametrize(
              "intervals",
              [np.array([[1.0, 1.1]], dtype=float), np.empty((0, 2), dtype=float)],
          )
          def test_padded_intervals_reject_invalid_padding_before_empty_shortcut(
              padding_s: float,
              intervals: np.ndarray,
          ) -> None:
              with pytest.raises(ValueError, match="finite and nonnegative"):
                  _padded_intervals(intervals, padding_s=padding_s)


          def test_spike_matched_null_windows_reject_negative_exclusion_padding() -> None:
              session = SimpleNamespace(
                  ripple_events=np.array([[1.0, 1.1]], dtype=float),
                  run_times=np.array([[0.0, 2.0]], dtype=float),
                  position=np.array([[0.0, 0.0, 0.0], [2.0, 2.0, 0.0]], dtype=float),
                  spikes=np.array([[1.01, 1.0], [1.05, 2.0]], dtype=float),
              )
              session.ripple = lambda index: SimpleNamespace(start=1.0, end=1.1)
              session.excitatory_spikes = lambda: session.spikes

              with pytest.raises(ValueError, match="finite and nonnegative"):
                  spike_matched_null_windows(
                      session,
                      0,
                      nulls_per_event=1,
                      random_seed=1,
                      candidate_step_s=0.1,
                      exclusion_padding_s=-0.04,
                  )


          def test_padded_intervals_preserve_zero_and_positive_padding() -> None:
              intervals = np.array([[1.0, 1.1]], dtype=float)

              np.testing.assert_allclose(
                  _padded_intervals(intervals, padding_s=0.0),
                  intervals,
              )
              np.testing.assert_allclose(
                  _padded_intervals(intervals, padding_s=0.2),
                  np.array([[0.8, 1.3]], dtype=float),
              )
          ''',
              encoding="utf-8",
          )

          Path(".github/workflows/apply-swr-padding-fix.yml").unlink()
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/spike_matched_event_window_null.py tests/test_swr_exclusion_padding_validation.py .github/workflows/apply-swr-padding-fix.yml
          git commit -m "Reject invalid SWR exclusion padding"
          git push
