name: Format exact event ID comparison fix

on:
  push:
    branches:
      - fix/artifact-event-id-precision

permissions:
  contents: write

jobs:
  format-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Format parser patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/compare_model_evidence_artifacts.py")
          lines = path.read_text(encoding="utf-8").splitlines()
          marker = '    frame = pd.read_csv('
          start = lines.index(marker)
          assert lines[start + 1].strip() == "path,"
          assert lines[start + 2].strip() == "dtype={"
          assert lines[start + 3].strip() == 'column: "string"'
          assert lines[start + 4].strip() == 'for column in (*_INTEGER_EVENT_KEY_COLUMNS, "event_id")'
          assert lines[start + 5].strip() == "},"
          lines[start + 2:start + 6] = [
              '        dtype={',
              '            column: "string"',
              '            for column in (*_INTEGER_EVENT_KEY_COLUMNS, "event_id")',
              '        },',
          ]
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          Path(".github/workflows/chatgpt-format-event-id-patch.yml").unlink()
          PY
          python -m py_compile scripts/compare_model_evidence_artifacts.py

      - name: Commit formatting fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/compare_model_evidence_artifacts.py .github/workflows/chatgpt-format-event-id-patch.yml
          git commit -m "Format exact event ID parser change"
          git push origin HEAD:fix/artifact-event-id-precision
