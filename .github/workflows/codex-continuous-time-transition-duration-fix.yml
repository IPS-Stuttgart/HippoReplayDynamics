name: Codex continuous-time transition duration fix

on:
  push:
    branches:
      - fix/continuous-time-transition-durations
    paths:
      - .github/workflows/codex-continuous-time-transition-duration-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Register continuous-time duration patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/hipporeplayimm/__init__.py")
          text = path.read_text(encoding="utf-8")

          import_line = (
              "from . import continuous_time_transition_duration_patch "
              "as _continuous_time_transition_duration_patch\n"
          )
          import_anchor = (
              "from . import clusterless_config_validation "
              "as _clusterless_config_validation\n"
          )
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit("Missing continuous-time patch import anchor")
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          apply_line = (
              "    _continuous_time_transition_duration_patch."
              "apply_continuous_time_transition_duration_patch()\n"
          )
          apply_anchor = (
              "    _accuracy_replay_gain_gamma_patch."
              "apply_accuracy_replay_gain_gamma_patch()\n"
          )
          if apply_line not in text:
              if apply_anchor not in text:
                  raise SystemExit("Missing continuous-time patch application anchor")
              text = text.replace(apply_anchor, apply_anchor + apply_line, 1)

          if text.count(import_line) != 1 or text.count(apply_line) != 1:
              raise SystemExit("Continuous-time patch registration is not unique")
          path.write_text(text, encoding="utf-8")
          PY
      - name: Install package
        run: python -m pip install -e .[dev]
      - name: Run targeted tests
        run: >-
          python -m pytest
          tests/test_continuous_time_transition_durations.py
          tests/test_accuracy_upgrade_validation.py
          -q
      - name: Commit source fix
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hipporeplayimm/__init__.py
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Register continuous-time transition duration patch"
          git push
