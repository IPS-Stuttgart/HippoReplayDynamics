name: Codex place-field threshold fix dispatcher

on:
  push:
    branches:
      - main
    paths:
      - .github/hipporeplayimm-place-field-threshold-fix-dispatch.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/apply-place-field-thresholds
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply place-field unit QC fix
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("scripts/summarize_olafsdottir_track1_decoder_qc.py")
          source = source_path.read_text(encoding="utf-8")
          old = '''    table.loc[:, "unit_qc_passed"] = table["unit_qc_passed"].map(_as_bool)
    table.attrs["n_place_like_units"] = int(place_like.sum())
'''
          new = '''    # The place-field thresholds are decoder inclusion criteria, not merely
    # diagnostics.  Keep the exported pass flag and the selected unit set aligned.
    table.loc[:, "unit_qc_passed"] = place_like.astype(bool)
    table.attrs["n_place_like_units"] = int(place_like.sum())
'''
          if old not in source:
              raise SystemExit("Missing unit-QC patch anchor")
          source_path.write_text(source.replace(old, new, 1), encoding="utf-8")

          test_path = Path("tests/test_olafsdottir_track1_decoder_qc.py")
          tests = test_path.read_text(encoding="utf-8")
          test_name = "test_track1_decoder_qc_applies_place_field_thresholds"
          if test_name not in tests:
              anchor = "\ndef _write_linearized_position(path: Path) -> None:\n"
              regression = r'''

def test_track1_decoder_qc_applies_place_field_thresholds(monkeypatch) -> None:
    module = _load_module()
    times = np.arange(0.0, 1.0, 0.1)
    linearized = pd.DataFrame(
        {
            "time_s": times,
            "linear_position_cm": np.linspace(0.0, 9.0, times.size),
            "valid_position": True,
        }
    )
    spike_times = np.array([0.05, 0.25, 0.45, 0.65, 0.85], dtype=float)
    spikes = module.TrackSpikes(
        spike_times_s=spike_times,
        unit_ids=np.ones(spike_times.shape, dtype=int),
        units=(1,),
    )

    monkeypatch.setattr(module, "spatial_information", lambda rates, occupancy: 0.01)
    below_information, _ = module.unit_qc_table(
        animal="RTEST",
        date="2026-01-01",
        track_session="track1",
        linearized=linearized,
        spikes=spikes,
        position_bin_size_cm=2.0,
        min_unit_spikes=1,
        min_unit_mean_rate_hz=0.0,
        min_place_information_bits=0.05,
        min_place_peak_rate_hz=0.0,
        smoothing_bins=1,
    )
    assert not bool(below_information.loc[0, "unit_qc_passed"])
    assert below_information.attrs["n_place_like_units"] == 0

    monkeypatch.setattr(module, "spatial_information", lambda rates, occupancy: 1.0)
    below_peak_rate, _ = module.unit_qc_table(
        animal="RTEST",
        date="2026-01-01",
        track_session="track1",
        linearized=linearized,
        spikes=spikes,
        position_bin_size_cm=2.0,
        min_unit_spikes=1,
        min_unit_mean_rate_hz=0.0,
        min_place_information_bits=0.05,
        min_place_peak_rate_hz=1.0e6,
        smoothing_bins=1,
    )
    assert not bool(below_peak_rate.loc[0, "unit_qc_passed"])
    assert below_peak_rate.attrs["n_place_like_units"] == 0
'''
              if anchor not in tests:
                  raise SystemExit("Missing decoder-QC test insertion anchor")
              test_path.write_text(tests.replace(anchor, regression + anchor, 1), encoding="utf-8")
          PY
      - name: Install package
        run: python -m pip install -e .[dev]
      - name: Run focused tests
        run: python -m pytest tests/test_olafsdottir_track1_decoder_qc.py -q
      - name: Run focused lint
        run: python -m ruff check scripts/summarize_olafsdottir_track1_decoder_qc.py tests/test_olafsdottir_track1_decoder_qc.py
      - name: Commit source fix to feature branch
        run: |
          rm -f .github/workflows/codex-place-field-threshold-fix.yml
          rm -f .github/hipporeplayimm-place-field-threshold-fix-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/summarize_olafsdottir_track1_decoder_qc.py tests/test_olafsdottir_track1_decoder_qc.py .github/workflows/codex-place-field-threshold-fix.yml .github/hipporeplayimm-place-field-threshold-fix-trigger.txt
          git commit -m "Apply place-field thresholds to decoder unit QC"
          git push origin HEAD:agent/apply-place-field-thresholds
      - name: Remove dispatcher from main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          rm .github/workflows/codex-place-field-threshold-fix-dispatch.yml
          rm .github/hipporeplayimm-place-field-threshold-fix-dispatch.txt
          git add .github/workflows/codex-place-field-threshold-fix-dispatch.yml .github/hipporeplayimm-place-field-threshold-fix-dispatch.txt
          git commit -m "Remove one-shot place-field QC dispatcher"
          git push origin main
