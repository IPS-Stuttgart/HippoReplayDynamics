name: Finalize state-space zero-prior support fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out finalized patch branch
        uses: actions/checkout@v6
        with:
          ref: fix-state-space-zero-prior-support

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Normalize regression-test spacing
        run: |
          python - <<'PY'
          from pathlib import Path

          test_path = Path("tests/test_marginalize_state_space_sweep.py")
          tests = test_path.read_text(encoding="utf-8")
          tests = tests.replace(
              "\n\n\ndef test_marginalize_state_space_sweep_preserves_zero_prior_support(",
              "\n\ndef test_marginalize_state_space_sweep_preserves_zero_prior_support(",
              1,
          )
          test_path.write_text(tests, encoding="utf-8")
          PY

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Apply safe Ruff fixes
        run: |
          python -m ruff check --fix scripts/marginalize_state_space_sweep.py tests/test_marginalize_state_space_sweep.py

      - name: Verify targeted Ruff checks
        run: |
          python -m ruff check scripts/marginalize_state_space_sweep.py tests/test_marginalize_state_space_sweep.py

      - name: Compile repository Python sources
        run: |
          python -m compileall -q src scripts tests

      - name: Run complete test suite
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python -m pytest --rootdir . -q ./tests

      - name: Commit lint cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/marginalize_state_space_sweep.py tests/test_marginalize_state_space_sweep.py
          if git diff --cached --quiet; then
            echo "Patch already clean; nothing to commit."
            exit 0
          fi
          git commit -m "Clean up state-space marginalization patch"
          git push origin HEAD:fix-state-space-zero-prior-support
