name: Apply state-space zero-prior support fix

on:
  push:
    branches:
      - fix-state-space-zero-prior-support
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v6
        with:
          ref: fix-state-space-zero-prior-support

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Apply source and regression-test patch
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          source_path = Path("scripts/marginalize_state_space_sweep.py")
          source = source_path.read_text(encoding="utf-8")
          old_import = "from hipporeplayimm.kd_reference import empirical_grid_prior\n"
          new_import = (
              "from hipporeplayimm.kd_grid_prior_support import "
              "_marginalize_grid_log_evidence\n"
              "from hipporeplayimm.kd_reference import empirical_grid_prior\n"
          )
          if new_import not in source:
              if old_import not in source:
                  raise SystemExit("expected empirical_grid_prior import not found")
              source = source.replace(old_import, new_import, 1)

          old_marginalization = (
              "        marginalized = logsumexp(grid + np.log(np.maximum(weights, "
              "np.finfo(float).tiny))[None, ...], axis=tuple(range(1, grid.ndim)))\n"
          )
          new_marginalization = (
              "        marginalized = _marginalize_grid_log_evidence(grid, weights)\n"
          )
          if new_marginalization not in source:
              if old_marginalization not in source:
                  raise SystemExit("expected clipped-prior marginalization line not found")
              source = source.replace(old_marginalization, new_marginalization, 1)
          source_path.write_text(source, encoding="utf-8")

          test_path = Path("tests/test_marginalize_state_space_sweep.py")
          tests = test_path.read_text(encoding="utf-8")
          test_name = "test_marginalize_state_space_sweep_preserves_zero_prior_support"
          addition_b64 = (
              "CgoKZGVmIHRlc3RfbWFyZ2luYWxpemVfc3RhdGVfc3BhY2Vfc3dlZXBfcHJlc2VydmVzX3plcm9fcHJpb3Jfc3VwcG9ydCgK"
              "ICAgIHRtcF9wYXRoOiBQYXRoLAogICAgbW9ua2V5cGF0Y2gsCik6CiAgICByb3dzID0gW10KICAgIGZvciBkaWZmdXNpb25f"
              "c2lnbWEsIGxvZ19ldmlkZW5jZSBpbiAoKDUwLjAsIDAuMCksICg2MC4wLCAxMDAwLjApKToKICAgICAgICByb3cgPSBfYmFz"
              "ZV9yb3coCiAgICAgICAgICAgIDAsCiAgICAgICAgICAgICJzb3J0ZWQtc3Bpa2Utc3RhdGUtc3BhY2UtZGlmZnVzaW9uIiwK"
              "ICAgICAgICAgICAgbG9nX2V2aWRlbmNlLAogICAgICAgICkKICAgICAgICByb3dbInN0YXRlX3NwYWNlX2RpZmZ1c2lvbl9z"
              "aWdtYV9jbV9zcXJ0X3MiXSA9IGRpZmZ1c2lvbl9zaWdtYQogICAgICAgIHJvd3MuYXBwZW5kKHJvdykKCiAgICBpbnB1dF9j"
              "c3YgPSB0bXBfcGF0aCAvICJzdGF0ZV9zcGFjZV9ldmlkZW5jZV9zd2VlcF9ldmVudF9zY29yZXMuY3N2IgogICAgcGQuRGF0"
              "YUZyYW1lKHJvd3MpLnRvX2NzdihpbnB1dF9jc3YsIGluZGV4PUZhbHNlKQoKICAgIGRlZiB6ZXJvX3N1cHBvcnRfcHJpb3Io"
              "Kl9hcmdzLCAqKl9rd2FyZ3MpOgogICAgICAgIHJldHVybiBucC5hc2FycmF5KFsxLjAsIDAuMF0pLCAidGVzdF96ZXJvX3N1"
              "cHBvcnQiCgogICAgbW9ua2V5cGF0Y2guc2V0YXR0cigKICAgICAgICBtYXJnaW5hbGl6ZV9zdGF0ZV9zcGFjZV9zd2VlcCwK"
              "ICAgICAgICAiX3ByaW9yX2Zvcl9ncmlkIiwKICAgICAgICB6ZXJvX3N1cHBvcnRfcHJpb3IsCiAgICApCiAgICB0YWJsZXMg"
              "PSBtYXJnaW5hbGl6ZV9zdGF0ZV9zcGFjZV9zd2VlcC5tYXJnaW5hbGl6ZV9zd2VlcCgKICAgICAgICBpbnB1dF9jc3YsCiAg"
              "ICAgICAgdG1wX3BhdGggLyAibWFyZ2luYWxpemVkIiwKICAgICAgICBtb2RlbHM9KCJkaWZmdXNpb24iLCksCiAgICAgICAg"
              "cHJpb3I9ImVtcGlyaWNhbCIsCiAgICApCgogICAgbWFyZ2luYWxpemVkID0gdGFibGVzWyJldmVudF9tb2RlbF9ldmlkZW5j"
              "ZSJdLmlsb2NbMF0KICAgIGFzc2VydCBucC5pc2Nsb3NlKG1hcmdpbmFsaXplZFsibG9nX2V2aWRlbmNlIl0sIDAuMCkKICAg"
              "IHByaW9yX3dlaWdodHMgPSB0YWJsZXNbInByaW9yX3dlaWdodHMiXS5zb3J0X3ZhbHVlcygKICAgICAgICAic3RhdGVfc3Bh"
              "Y2VfZGlmZnVzaW9uX3NpZ21hX2NtX3NxcnRfcyIKICAgICkKICAgIGFzc2VydCBucC5hbGxjbG9zZShwcmlvcl93ZWlnaHRz"
              "WyJwcmlvcl93ZWlnaHQiXS50b19udW1weSgpLCBbMS4wLCAwLjBdKQo="
          )
          if test_name not in tests:
              addition = base64.b64decode(addition_b64).decode("utf-8")
              test_path.write_text(tests + addition, encoding="utf-8")
          PY

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run complete validation
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python -m ruff check scripts/marginalize_state_space_sweep.py tests/test_marginalize_state_space_sweep.py
          python -m compileall -q src scripts tests
          python -m pytest --rootdir . -q ./tests

      - name: Commit clean patch
        shell: bash
        run: |
          rm -f .github/workflows/codex-state-space-zero-prior-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/marginalize_state_space_sweep.py tests/test_marginalize_state_space_sweep.py .github/workflows/codex-state-space-zero-prior-fix.yml
          if git diff --cached --quiet; then
            echo "Patch already applied; nothing to commit."
            exit 0
          fi
          git commit -m "Preserve zero prior support in state-space marginalization"
          git push origin HEAD:fix-state-space-zero-prior-support
