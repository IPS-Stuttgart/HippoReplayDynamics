name: Capture zero-prior Ruff diagnostics

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v6
        with:
          ref: fix-state-space-zero-prior-support

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Ruff
        run: python -m pip install "ruff>=0.8"

      - name: Capture targeted Ruff output
        run: |
          python -m ruff check scripts/marginalize_state_space_sweep.py tests/test_marginalize_state_space_sweep.py > .ruff-zero-prior-diagnostics.txt 2>&1 || true
          cat .ruff-zero-prior-diagnostics.txt

      - name: Publish diagnostic file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ruff-zero-prior-diagnostics.txt
          if git diff --cached --quiet; then
            echo "Diagnostic output unchanged."
            exit 0
          fi
          git commit -m "Capture Ruff diagnostics for zero-prior patch"
          git push origin HEAD:fix-state-space-zero-prior-support
