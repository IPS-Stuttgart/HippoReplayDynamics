name: Validate state-space zero-prior support fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out finalized patch branch
        uses: actions/checkout@v6
        with:
          ref: fix-state-space-zero-prior-support

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run targeted Ruff checks
        run: |
          python -m ruff check scripts/marginalize_state_space_sweep.py tests/test_marginalize_state_space_sweep.py

      - name: Compile repository Python sources
        run: |
          python -m compileall -q src scripts tests

      - name: Run complete test suite
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python -m pytest --rootdir . -q ./tests
