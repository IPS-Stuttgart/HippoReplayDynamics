---
name: Compare model-evidence runs

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "Repository containing both workflow artifacts"
        required: true
        default: "IPS-Stuttgart/HippoReplayIMM"
      left_run_id:
        description: "Left/source workflow run ID"
        required: true
        default: "25435692734"
      left_artifact_name:
        description: "Left/source model-evidence artifact name"
        required: true
        default: "kd-model-evidence-event-sharded-25435692734"
      left_label:
        description: "Short label for the left/source run"
        required: true
        default: "kd"
      right_run_id:
        description: "Right/comparison workflow run ID"
        required: true
        default: "25744259285"
      right_artifact_name:
        description: "Right/comparison model-evidence artifact name"
        required: true
        default: "model-evidence-event-sharded-25744259285"
      right_label:
        description: "Short label for the right/comparison run"
        required: true
        default: "state-space"
      output_dir:
        description: "Output directory for comparison CSVs"
        required: true
        default: "results/model-evidence-comparison"

permissions:
  contents: read
  actions: read

concurrency:
  group: compare-model-evidence-runs-${{ github.repository }}-${{ inputs.left_run_id }}-${{ inputs.right_run_id }}
  cancel-in-progress: false

env:
  SOURCE_REPO: ${{ inputs.source_repo }}
  LEFT_RUN_ID: ${{ inputs.left_run_id }}
  LEFT_ARTIFACT_NAME: ${{ inputs.left_artifact_name }}
  LEFT_LABEL: ${{ inputs.left_label }}
  RIGHT_RUN_ID: ${{ inputs.right_run_id }}
  RIGHT_ARTIFACT_NAME: ${{ inputs.right_artifact_name }}
  RIGHT_LABEL: ${{ inputs.right_label }}
  OUTPUT_DIR: ${{ inputs.output_dir }}

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas

      - name: Download left artifact
        uses: actions/download-artifact@v7
        with:
          repository: ${{ env.SOURCE_REPO }}
          run-id: ${{ env.LEFT_RUN_ID }}
          name: ${{ env.LEFT_ARTIFACT_NAME }}
          path: artifacts/left
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download right artifact
        uses: actions/download-artifact@v7
        with:
          repository: ${{ env.SOURCE_REPO }}
          run-id: ${{ env.RIGHT_RUN_ID }}
          name: ${{ env.RIGHT_ARTIFACT_NAME }}
          path: artifacts/right
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compare model-evidence runs
        run: |
          python scripts/compare_model_evidence_runs.py \
            --left artifacts/left \
            --right artifacts/right \
            --left-label "$LEFT_LABEL" \
            --right-label "$RIGHT_LABEL" \
            --output "$OUTPUT_DIR"
          test -f "$OUTPUT_DIR/event_best_model_comparison.csv"
          test -f "$OUTPUT_DIR/best_model_counts_comparison.csv"
          test -f "$OUTPUT_DIR/best_model_canonical_crosstab.csv"
          test -f "$OUTPUT_DIR/shared_model_relative_evidence_summary.csv"
          test -f "$OUTPUT_DIR/session_model_evidence_comparison.csv"
          test -f "$OUTPUT_DIR/model_evidence_run_comparison_summary.csv"

      - name: Upload comparison tables
        uses: actions/upload-artifact@v7
        with:
          name: model-evidence-run-comparison-${{ github.run_id }}
          path: |
            ${{ env.OUTPUT_DIR }}/event_best_model_comparison.csv
            ${{ env.OUTPUT_DIR }}/best_model_counts_comparison.csv
            ${{ env.OUTPUT_DIR }}/best_model_canonical_crosstab.csv
            ${{ env.OUTPUT_DIR }}/shared_model_relative_evidence_comparison.csv
            ${{ env.OUTPUT_DIR }}/shared_model_relative_evidence_summary.csv
            ${{ env.OUTPUT_DIR }}/session_model_evidence_comparison.csv
            ${{ env.OUTPUT_DIR }}/model_evidence_run_comparison_summary.csv
