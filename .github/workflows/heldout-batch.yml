---
name: Held-out replay likelihood batch

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  DATASET_ROOT: data/DataSetFromPfeifferFoster
  SESSION: Rat1/Open1
  EVENTS: 0-25
  MODELS: random stationary diffusion momentum imm
  REFERENCE_MODEL: diffusion
  CANDIDATE_TOP_K: "64"
  PYRECEST_PARTICLES: "512"
  TIME_BIN_S: "0.02"
  SPIKE_RATE_SCALE: "1.0"
  TEST_CELL_FRACTION: "0.25"
  RANDOM_SEED: "1"

jobs:
  heldout-batch:
    name: Held-out likelihood batch
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Ensure Pfeiffer-Foster dataset
        id: dataset
        uses: ./.github/actions/ensure-pfeiffer-foster-dataset
        with:
          dataset-root: ${{ env.DATASET_ROOT }}
          session: ${{ env.SESSION }}
          cache-key: hipporeplayimm-dataset-${{ runner.os }}-rclone-v1
          webdav-url: ${{ secrets.PFEIFFERFOSTER_WEBDAV_URL }}
          webdav-key: ${{ secrets.PFEIFFERFOSTER_DATA_KEY }}
          webdav-password: ${{ secrets.PFEIFFERFOSTER_DATA_PASSWORD }}

      - name: Run held-out likelihood batch
        run: |
          python scripts/heldout_batch.py \
            --dataset-root "${DATASET_ROOT}" \
            --session "${SESSION}" \
            --events "${EVENTS}" \
            --models ${MODELS} \
            --reference-model "${REFERENCE_MODEL}" \
            --candidate-top-k "${CANDIDATE_TOP_K}" \
            --pyrecest-particles "${PYRECEST_PARTICLES}" \
            --time-bin-s "${TIME_BIN_S}" \
            --spike-rate-scale "${SPIKE_RATE_SCALE}" \
            --test-cell-fraction "${TEST_CELL_FRACTION}" \
            --random-seed "${RANDOM_SEED}" \
            --output results/heldout-batch \
            --continue-on-error

      - name: Show held-out summary
        if: always()
        run: |
          if [ -f results/heldout-batch/summary.csv ]; then
            python - <<'PY'
          import pandas as pd

          summary = pd.read_csv('results/heldout-batch/summary.csv')
          print('Model summary:')
          print(summary.to_string(index=False))

          scores = pd.read_csv('results/heldout-batch/event_scores.csv')
          print('\nRows:', len(scores))
          print('Failures:', int((scores['status'] == 'failure').sum()))

          deltas = pd.read_csv('results/heldout-batch/paired_delta_summary.csv')
          if not deltas.empty:
              print('\nPaired deltas:')
              print(deltas.to_string(index=False))
          PY
          else
            echo "No held-out summary was generated."
          fi

      - name: Upload held-out likelihood results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: replay-heldout-batch-rat1-open1-events-0-25
          path: results/heldout-batch/
          if-no-files-found: error
