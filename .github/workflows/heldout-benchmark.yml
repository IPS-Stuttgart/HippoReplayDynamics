---
name: Benchmark Pfeiffer-Foster held-out likelihood

on:
  workflow_dispatch:
    inputs:
      dataset_root:
        description: "Dataset path after download"
        required: true
        default: "data/DataSetFromPfeifferFoster"
      session:
        description: "Session ID, e.g. Rat1/Open1"
        required: true
        default: "Rat1/Open1"
      events:
        description: "Event ids/ranges, e.g. 0-25 or 0-25,30"
        required: true
        default: "0-25"
      models:
        description: "Space-separated models"
        required: true
        default: "random stationary diffusion momentum imm"
      candidate_top_k:
        description: "Candidate spatial bins per time bin"
        required: true
        default: "64"
      pyrecest_particles:
        description: "Particle count for PyRecEst-backed models"
        required: true
        default: "512"
      test_cell_fraction:
        description: "Fraction of cells held out for likelihood evaluation"
        required: true
        default: "0.25"
      random_seed:
        description: "Random seed for train/test cell split"
        required: true
        default: "1"
      time_bin_s:
        description: "Ripple decoding time-bin width in seconds"
        required: true
        default: "0.02"

permissions:
  contents: read

env:
  DATASET_ROOT: ${{ inputs.dataset_root }}
  SESSION: ${{ inputs.session }}
  EVENTS: ${{ inputs.events }}
  MODELS: ${{ inputs.models }}
  CANDIDATE_TOP_K: ${{ inputs.candidate_top_k }}
  PYRECEST_PARTICLES: ${{ inputs.pyrecest_particles }}
  TEST_CELL_FRACTION: ${{ inputs.test_cell_fraction }}
  RANDOM_SEED: ${{ inputs.random_seed }}
  TIME_BIN_S: ${{ inputs.time_bin_s }}

jobs:
  heldout-benchmark:
    name: Held-out replay benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Ensure Pfeiffer-Foster dataset
        id: dataset
        uses: ./.github/actions/ensure-pfeiffer-foster-dataset
        with:
          dataset-root: ${{ env.DATASET_ROOT }}
          session: ${{ env.SESSION }}
          cache-key: hipporeplayimm-dataset-${{ runner.os }}-rclone-v1
          webdav-url: ${{ secrets.PFEIFFERFOSTER_WEBDAV_URL }}
          webdav-key: ${{ secrets.PFEIFFERFOSTER_DATA_KEY }}
          webdav-password: ${{ secrets.PFEIFFERFOSTER_DATA_PASSWORD }}

      - name: Run held-out benchmark
        run: |
          python scripts/benchmark_session.py \
            --dataset-root "${DATASET_ROOT}" \
            --session "${SESSION}" \
            --events "${EVENTS}" \
            --models ${MODELS} \
            --candidate-top-k "${CANDIDATE_TOP_K}" \
            --pyrecest-particles "${PYRECEST_PARTICLES}" \
            --test-cell-fraction "${TEST_CELL_FRACTION}" \
            --random-seed "${RANDOM_SEED}" \
            --time-bin-s "${TIME_BIN_S}" \
            --output results/heldout-benchmark \
            --continue-on-error

      - name: Show held-out benchmark summary
        if: always()
        run: |
          if [ -f results/heldout-benchmark/summary.csv ]; then
            python - <<'PY'
          import pandas as pd
          scores = pd.read_csv("results/heldout-benchmark/event_scores.csv")
          summary = pd.read_csv("results/heldout-benchmark/summary.csv")
          print(summary.to_string(index=False))
          print("\nRows:", len(scores))
          if "status" in scores.columns:
              print("Failures:", int((scores["status"] != "success").sum()))
          PY
          else
            echo "No held-out benchmark summary was generated."
          fi

      - name: Upload held-out benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: heldout-benchmark-seed-${{ env.RANDOM_SEED }}
          path: results/heldout-benchmark/
          if-no-files-found: error
