---
name: Benchmark Pfeiffer-Foster held-out likelihood

on:
  workflow_dispatch:
    inputs:
      dataset_root:
        description: "Dataset path after download"
        required: true
        default: "data/DataSetFromPfeifferFoster"
      session:
        description: "Session ID, e.g. Rat1/Open1"
        required: true
        default: "Rat1/Open1"
      events:
        description: "Event ids/ranges, e.g. 0-25 or 0-25,30"
        required: true
        default: "0-25"
      models:
        description: "Space-separated models"
        required: true
        default: "random stationary diffusion momentum imm"
      candidate_top_k:
        description: "Candidate spatial bins per time bin"
        required: true
        default: "64"
      pyrecest_particles:
        description: "Particle count for PyRecEst-backed models"
        required: true
        default: "512"
      pyrecest_alpha:
        description: "PyRecEst goal-attraction alpha"
        required: true
        default: "0.8"
      pyrecest_beta:
        description: "PyRecEst goal-attraction beta"
        required: true
        default: "1.0"
      pyrecest_process_noise_sigma_cm_s:
        description: "PyRecEst process-noise standard deviation in cm/s"
        required: true
        default: "60.0"
      pyrecest_position_jump_sigma_cm:
        description: "PyRecEst jump-proposal standard deviation in cm"
        required: true
        default: "25.0"
      pyrecest_jump_probability:
        description: "PyRecEst per-step jump probability"
        required: true
        default: "0.03"
      pyrecest_goal_reset_probability:
        description: "PyRecEst per-step goal-reset probability"
        required: true
        default: "0.02"
      pyrecest_position_proposal_probability:
        description: "Probability of rejuvenating particles from the decoded grid likelihood"
        required: true
        default: "0.0"
      pyrecest_initial_velocity_sigma_cm_s:
        description: "PyRecEst initial velocity prior standard deviation in cm/s"
        required: true
        default: "120.0"
      pyrecest_imm_mode_stickiness:
        description: "PyRecEst IMM mode self-transition probability"
        required: true
        default: "0.95"
      pyrecest_imm_stationary_velocity_decay:
        description: "PyRecEst IMM stationary-mode velocity decay"
        required: true
        default: "0.0"
      pyrecest_imm_diffusion_velocity_decay:
        description: "PyRecEst IMM diffusion-mode velocity decay"
        required: true
        default: "0.0"
      pyrecest_imm_momentum_velocity_decay:
        description: "PyRecEst IMM momentum-mode velocity decay"
        required: true
        default: "0.95"
      pyrecest_imm_jump_fraction:
        description: "PyRecEst IMM jump-mode position-jump fraction"
        required: true
        default: "0.9"
      pyrecest_imm_jump_velocity_decay:
        description: "PyRecEst IMM jump-mode velocity decay"
        required: true
        default: "0.25"
      test_cell_fraction:
        description: "Fraction of cells held out for likelihood evaluation"
        required: true
        default: "0.25"
      random_seed:
        description: "Random seed for train/test cell split"
        required: true
        default: "1"
      time_bin_s:
        description: "Ripple decoding time-bin width in seconds"
        required: true
        default: "0.02"
      spike_rate_scale:
        description: "Multiplicative scale applied to Poisson place-field rates during ripple scoring"
        required: true
        default: "1.0"

permissions:
  contents: read

env:
  DATASET_ROOT: ${{ inputs.dataset_root }}
  SESSION: ${{ inputs.session }}
  EVENTS: ${{ inputs.events }}
  MODELS: ${{ inputs.models }}
  CANDIDATE_TOP_K: ${{ inputs.candidate_top_k }}
  PYRECEST_PARTICLES: ${{ inputs.pyrecest_particles }}
  PYRECEST_ALPHA: ${{ inputs.pyrecest_alpha }}
  PYRECEST_BETA: ${{ inputs.pyrecest_beta }}
  PYRECEST_PROCESS_NOISE_SIGMA_CM_S: ${{ inputs.pyrecest_process_noise_sigma_cm_s }}
  PYRECEST_POSITION_JUMP_SIGMA_CM: ${{ inputs.pyrecest_position_jump_sigma_cm }}
  PYRECEST_JUMP_PROBABILITY: ${{ inputs.pyrecest_jump_probability }}
  PYRECEST_GOAL_RESET_PROBABILITY: ${{ inputs.pyrecest_goal_reset_probability }}
  PYRECEST_POSITION_PROPOSAL_PROBABILITY: ${{ inputs.pyrecest_position_proposal_probability }}
  PYRECEST_INITIAL_VELOCITY_SIGMA_CM_S: ${{ inputs.pyrecest_initial_velocity_sigma_cm_s }}
  PYRECEST_IMM_MODE_STICKINESS: ${{ inputs.pyrecest_imm_mode_stickiness }}
  PYRECEST_IMM_STATIONARY_VELOCITY_DECAY: ${{ inputs.pyrecest_imm_stationary_velocity_decay }}
  PYRECEST_IMM_DIFFUSION_VELOCITY_DECAY: ${{ inputs.pyrecest_imm_diffusion_velocity_decay }}
  PYRECEST_IMM_MOMENTUM_VELOCITY_DECAY: ${{ inputs.pyrecest_imm_momentum_velocity_decay }}
  PYRECEST_IMM_JUMP_FRACTION: ${{ inputs.pyrecest_imm_jump_fraction }}
  PYRECEST_IMM_JUMP_VELOCITY_DECAY: ${{ inputs.pyrecest_imm_jump_velocity_decay }}
  TEST_CELL_FRACTION: ${{ inputs.test_cell_fraction }}
  RANDOM_SEED: ${{ inputs.random_seed }}
  TIME_BIN_S: ${{ inputs.time_bin_s }}
  SPIKE_RATE_SCALE: ${{ inputs.spike_rate_scale }}

jobs:
  heldout-benchmark:
    name: Held-out replay benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Ensure Pfeiffer-Foster dataset
        id: dataset
        uses: ./.github/actions/ensure-pfeiffer-foster-dataset
        with:
          dataset-root: ${{ env.DATASET_ROOT }}
          session: ${{ env.SESSION }}
          cache-key: hipporeplayimm-dataset-${{ runner.os }}-rclone-v1
          webdav-url: ${{ secrets.PFEIFFERFOSTER_WEBDAV_URL }}
          webdav-key: ${{ secrets.PFEIFFERFOSTER_DATA_KEY }}
          webdav-password: ${{ secrets.PFEIFFERFOSTER_DATA_PASSWORD }}

      - name: Run held-out benchmark
        run: |
          python scripts/benchmark_session.py \
            --dataset-root "${DATASET_ROOT}" \
            --session "${SESSION}" \
            --events "${EVENTS}" \
            --models ${MODELS} \
            --candidate-top-k "${CANDIDATE_TOP_K}" \
            --pyrecest-particles "${PYRECEST_PARTICLES}" \
            --pyrecest-alpha "${PYRECEST_ALPHA}" \
            --pyrecest-beta "${PYRECEST_BETA}" \
            --pyrecest-process-noise-sigma-cm-s "${PYRECEST_PROCESS_NOISE_SIGMA_CM_S}" \
            --pyrecest-position-jump-sigma-cm "${PYRECEST_POSITION_JUMP_SIGMA_CM}" \
            --pyrecest-jump-probability "${PYRECEST_JUMP_PROBABILITY}" \
            --pyrecest-goal-reset-probability "${PYRECEST_GOAL_RESET_PROBABILITY}" \
            --pyrecest-position-proposal-probability "${PYRECEST_POSITION_PROPOSAL_PROBABILITY}" \
            --pyrecest-initial-velocity-sigma-cm-s "${PYRECEST_INITIAL_VELOCITY_SIGMA_CM_S}" \
            --pyrecest-imm-mode-stickiness "${PYRECEST_IMM_MODE_STICKINESS}" \
            --pyrecest-imm-stationary-velocity-decay "${PYRECEST_IMM_STATIONARY_VELOCITY_DECAY}" \
            --pyrecest-imm-diffusion-velocity-decay "${PYRECEST_IMM_DIFFUSION_VELOCITY_DECAY}" \
            --pyrecest-imm-momentum-velocity-decay "${PYRECEST_IMM_MOMENTUM_VELOCITY_DECAY}" \
            --pyrecest-imm-jump-fraction "${PYRECEST_IMM_JUMP_FRACTION}" \
            --pyrecest-imm-jump-velocity-decay "${PYRECEST_IMM_JUMP_VELOCITY_DECAY}" \
            --test-cell-fraction "${TEST_CELL_FRACTION}" \
            --random-seed "${RANDOM_SEED}" \
            --time-bin-s "${TIME_BIN_S}" \
            --spike-rate-scale "${SPIKE_RATE_SCALE}" \
            --output results/heldout-benchmark \
            --continue-on-error

      - name: Show held-out benchmark summary
        if: always()
        run: |
          if [ -f results/heldout-benchmark/summary.csv ]; then
            python - <<'PY'
          import pandas as pd
          scores = pd.read_csv("results/heldout-benchmark/event_scores.csv")
          summary = pd.read_csv("results/heldout-benchmark/summary.csv")
          print(summary.to_string(index=False))
          print("\nRows:", len(scores))
          if "status" in scores.columns:
              print("Failures:", int((scores["status"] != "success").sum()))
          PY
          else
            echo "No held-out benchmark summary was generated."
          fi

      - name: Upload held-out benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: heldout-benchmark-seed-${{ env.RANDOM_SEED }}
          path: results/heldout-benchmark/
          if-no-files-found: error
