---
name: Benchmark replay model evidence all sessions

on:
  workflow_dispatch:
    inputs:
      dataset_root:
        description: "Dataset path after download or cache restore"
        required: true
        default: "data/DataSetFromPfeifferFoster"
      sessions:
        description: "Space- or comma-separated sessions"
        required: true
        default: "Rat1/Open1 Rat1/Open2 Rat2/Open1 Rat2/Open2 Rat3/Open1 Rat3/Open2 Rat4/Open1 Rat4/Open2"
      events:
        description: "Event IDs/ranges, all, run, or run:0-25"
        required: true
        default: "run"
      max_events:
        description: "Maximum selected events per session; empty means no cap"
        required: false
        default: ""
      models:
        description: "Space-separated models"
        required: true
        default: "sorted-spike-state-space-stationary sorted-spike-state-space-diffusion sorted-spike-state-space-fragmented sorted-spike-state-space-first-order-imm sorted-spike-state-space-momentum sorted-spike-state-space-imm"
      event_shard_count:
        description: "Target event shards per session"
        required: true
        default: "16"
      candidate_top_k:
        description: "Candidate spatial bins per time bin for candidate-pruned models"
        required: true
        default: "64"
      state_space_stationary_sigma_cm:
        description: "State-space stationary transition sigma in cm"
        required: true
        default: "2.0"
      state_space_diffusion_sigma_cm_sqrt_s:
        description: "State-space diffusion noise in cm/sqrt(s)"
        required: true
        default: "85.0"
      state_space_max_step_sigma:
        description: "State-space Gaussian transition truncation radius in sigmas"
        required: true
        default: "4.0"
      state_space_imm_mode_stickiness:
        description: "State-space IMM mode-transition stickiness"
        required: true
        default: "0.95"
      state_space_momentum_sigma_cm_sqrt_s:
        description: "State-space momentum process noise in cm/sqrt(s)"
        required: true
        default: "85.0"
      state_space_momentum_initial_sigma_cm_sqrt_s:
        description: "State-space momentum initial transition noise in cm/sqrt(s)"
        required: true
        default: "85.0"
      state_space_momentum_velocity_decay:
        description: "State-space momentum velocity decay"
        required: true
        default: "0.95"
      state_space_momentum_candidate_top_k:
        description: "State-space momentum candidate spatial bins per time bin"
        required: true
        default: "128"
      clusterless_mark_smoothing_sigma_bins:
        description: "Clusterless mark-parameter smoothing sigma in spatial bins"
        required: true
        default: "1.0"
      clusterless_mark_prior_count:
        description: "Clusterless Gaussian mark prior pseudo-count"
        required: true
        default: "1.0"
      clusterless_mark_variance_floor:
        description: "Clusterless Gaussian mark variance floor"
        required: true
        default: "1.0"
      time_bin_s:
        description: "Ripple decoding time-bin width in seconds"
        required: true
        default: "0.003"
      spike_rate_scale:
        description: "Multiplicative scale applied to Poisson place-field rates during ripple scoring"
        required: true
        default: "1.0"
      bin_size_cm:
        description: "Place-field spatial bin size in centimeters"
        required: true
        default: "6.0"
      smoothing_sigma_bins:
        description: "Place-field smoothing sigma in spatial bins"
        required: true
        default: "2.0"
      min_speed_cm_s:
        description: "Minimum speed for place-field training in cm/s"
        required: true
        default: "5.0"
      local_cache_root:
        description: "Optional self-hosted persistent dataset cache path"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: model-evidence-all-sessions-${{ github.repository }}-${{ inputs.sessions }}-${{ inputs.events }}-${{ inputs.max_events }}-${{ inputs.spike_rate_scale }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DATASET_ROOT: ${{ inputs.dataset_root }}
  SESSIONS: ${{ inputs.sessions }}
  EVENTS: ${{ inputs.events }}
  MAX_EVENTS: ${{ inputs.max_events }}
  MODELS: ${{ inputs.models }}
  EVENT_SHARD_COUNT: ${{ inputs.event_shard_count }}
  CANDIDATE_TOP_K: ${{ inputs.candidate_top_k }}
  STATE_SPACE_STATIONARY_SIGMA_CM: ${{ inputs.state_space_stationary_sigma_cm }}
  STATE_SPACE_DIFFUSION_SIGMA_CM_SQRT_S: ${{ inputs.state_space_diffusion_sigma_cm_sqrt_s }}
  STATE_SPACE_MAX_STEP_SIGMA: ${{ inputs.state_space_max_step_sigma }}
  STATE_SPACE_IMM_MODE_STICKINESS: ${{ inputs.state_space_imm_mode_stickiness }}
  STATE_SPACE_MOMENTUM_SIGMA_CM_SQRT_S: ${{ inputs.state_space_momentum_sigma_cm_sqrt_s }}
  STATE_SPACE_MOMENTUM_INITIAL_SIGMA_CM_SQRT_S: ${{ inputs.state_space_momentum_initial_sigma_cm_sqrt_s }}
  STATE_SPACE_MOMENTUM_VELOCITY_DECAY: ${{ inputs.state_space_momentum_velocity_decay }}
  STATE_SPACE_MOMENTUM_CANDIDATE_TOP_K: ${{ inputs.state_space_momentum_candidate_top_k }}
  CLUSTERLESS_MARK_SMOOTHING_SIGMA_BINS: ${{ inputs.clusterless_mark_smoothing_sigma_bins }}
  CLUSTERLESS_MARK_PRIOR_COUNT: ${{ inputs.clusterless_mark_prior_count }}
  CLUSTERLESS_MARK_VARIANCE_FLOOR: ${{ inputs.clusterless_mark_variance_floor }}
  TIME_BIN_S: ${{ inputs.time_bin_s }}
  SPIKE_RATE_SCALE: ${{ inputs.spike_rate_scale }}
  BIN_SIZE_CM: ${{ inputs.bin_size_cm }}
  SMOOTHING_SIGMA_BINS: ${{ inputs.smoothing_sigma_bins }}
  MIN_SPEED_CM_S: ${{ inputs.min_speed_cm_s }}
  LOCAL_CACHE_ROOT: ${{ inputs.local_cache_root }}
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  plan-session-event-shards:
    name: Plan session/event shards
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      event_matrix: ${{ steps.plan.outputs.event_matrix }}
      event_count: ${{ steps.plan.outputs.event_count }}
      session_count: ${{ steps.plan.outputs.session_count }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Ensure Pfeiffer-Foster dataset
        id: dataset
        uses: ./.github/actions/ensure-pfeiffer-foster-dataset
        with:
          dataset-root: ${{ env.DATASET_ROOT }}
          session: Rat1/Open1
          cache-key: hipporeplayimm-dataset-${{ runner.os }}-rclone-v1
          local-cache-root: ${{ env.LOCAL_CACHE_ROOT }}
          webdav-url: ${{ secrets.PFEIFFERFOSTER_WEBDAV_URL }}
          webdav-key: ${{ secrets.PFEIFFERFOSTER_DATA_KEY }}
          webdav-password: ${{ secrets.PFEIFFERFOSTER_DATA_PASSWORD }}

      - name: Plan session/event shards
        id: plan
        run: |
          set -euo pipefail
          mkdir -p results/model-evidence-all-session-plan
          max_events_args=()
          if [ -n "${MAX_EVENTS}" ]; then
            max_events_args+=(--max-events "${MAX_EVENTS}")
          fi
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          sessions = [s for s in re.split(r"[\s,]+", os.environ["SESSIONS"].strip()) if s]
          if not sessions:
              raise SystemExit("No sessions selected")
          output_dir = Path("results/model-evidence-all-session-plan")
          matrix = []
          total_events = 0
          for session in sessions:
              safe_session = session.replace("/", "_").replace("\\", "_")
              plan_path = output_dir / f"plan_{safe_session}.json"
              cmd = [
                  "python", "scripts/plan_model_evidence_event_shards.py",
                  "--dataset-root", os.environ["DATASET_ROOT"],
                  "--session", session,
                  "--events", os.environ["EVENTS"],
                  "--event-shard-count", os.environ["EVENT_SHARD_COUNT"],
                  "--output", str(plan_path),
              ]
              if os.environ.get("MAX_EVENTS"):
                  cmd.extend(["--max-events", os.environ["MAX_EVENTS"]])
              subprocess.run(cmd, check=True)
              plan = json.loads(plan_path.read_text(encoding="utf-8"))
              total_events += int(plan["event_count"])
              for shard in plan["event_matrix"]:
                  shard = dict(shard)
                  shard["session"] = session
                  shard["session_slug"] = safe_session
                  shard["global_shard_index"] = len(matrix)
                  matrix.append(shard)
          if len(matrix) > 256:
              raise SystemExit(f"Session/event matrix has {len(matrix)} jobs, exceeding GitHub Actions' 256-job matrix limit")
          all_plan = {
              "sessions": sessions,
              "events": os.environ["EVENTS"],
              "max_events": os.environ.get("MAX_EVENTS") or None,
              "session_count": len(sessions),
              "event_count": total_events,
              "event_matrix": matrix,
          }
          (output_dir / "all_session_event_plan.json").write_text(json.dumps(all_plan, indent=2) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"event_matrix={json.dumps(matrix, separators=(',', ':'))}\n")
              output.write(f"event_count={total_events}\n")
              output.write(f"session_count={len(sessions)}\n")
          print(f"Planned {total_events} events across {len(sessions)} sessions and {len(matrix)} shards.")
          PY

      - name: Upload all-session event-shard plan
        uses: actions/upload-artifact@v7
        with:
          name: model-evidence-all-session-plan-${{ github.run_id }}
          path: results/model-evidence-all-session-plan/
          if-no-files-found: error

  model-evidence-shard:
    name: Model evidence ${{ matrix.event.session }} shard ${{ matrix.event.event_shard_index }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: plan-session-event-shards
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        event: ${{ fromJson(needs.plan-session-event-shards.outputs.event_matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Ensure Pfeiffer-Foster dataset
        id: dataset
        uses: ./.github/actions/ensure-pfeiffer-foster-dataset
        with:
          dataset-root: ${{ env.DATASET_ROOT }}
          session: ${{ matrix.event.session }}
          cache-key: hipporeplayimm-dataset-${{ runner.os }}-rclone-v1
          local-cache-root: ${{ env.LOCAL_CACHE_ROOT }}
          webdav-url: ${{ secrets.PFEIFFERFOSTER_WEBDAV_URL }}
          webdav-key: ${{ secrets.PFEIFFERFOSTER_DATA_KEY }}
          webdav-password: ${{ secrets.PFEIFFERFOSTER_DATA_PASSWORD }}

      - name: Run model-evidence session/event shard
        env:
          SHARD_SESSION: ${{ matrix.event.session }}
          SHARD_SESSION_SLUG: ${{ matrix.event.session_slug }}
          EVENT_SHARD_INDEX: ${{ matrix.event.event_shard_index }}
          GLOBAL_SHARD_INDEX: ${{ matrix.event.global_shard_index }}
          SHARD_EVENTS: ${{ matrix.event.events_spec }}
        run: |
          set -euo pipefail
          out_dir="results/model-evidence-${SHARD_SESSION_SLUG}-shard-${EVENT_SHARD_INDEX}"
          python scripts/benchmark_model_evidence.py \
            --dataset-root "${DATASET_ROOT}" \
            --session "${SHARD_SESSION}" \
            --events "${SHARD_EVENTS}" \
            --models "${MODELS}" \
            --candidate-top-k "${CANDIDATE_TOP_K}" \
            --state-space-stationary-sigma-cm "${STATE_SPACE_STATIONARY_SIGMA_CM}" \
            --state-space-diffusion-sigma-cm-sqrt-s "${STATE_SPACE_DIFFUSION_SIGMA_CM_SQRT_S}" \
            --state-space-max-step-sigma "${STATE_SPACE_MAX_STEP_SIGMA}" \
            --state-space-imm-mode-stickiness "${STATE_SPACE_IMM_MODE_STICKINESS}" \
            --state-space-momentum-sigma-cm-sqrt-s "${STATE_SPACE_MOMENTUM_SIGMA_CM_SQRT_S}" \
            --state-space-momentum-initial-sigma-cm-sqrt-s "${STATE_SPACE_MOMENTUM_INITIAL_SIGMA_CM_SQRT_S}" \
            --state-space-momentum-velocity-decay "${STATE_SPACE_MOMENTUM_VELOCITY_DECAY}" \
            --state-space-momentum-candidate-top-k "${STATE_SPACE_MOMENTUM_CANDIDATE_TOP_K}" \
            --clusterless-mark-smoothing-sigma-bins "${CLUSTERLESS_MARK_SMOOTHING_SIGMA_BINS}" \
            --clusterless-mark-prior-count "${CLUSTERLESS_MARK_PRIOR_COUNT}" \
            --clusterless-mark-variance-floor "${CLUSTERLESS_MARK_VARIANCE_FLOOR}" \
            --time-bin-s "${TIME_BIN_S}" \
            --spike-rate-scale "${SPIKE_RATE_SCALE}" \
            --bin-size-cm "${BIN_SIZE_CM}" \
            --smoothing-sigma-bins "${SMOOTHING_SIGMA_BINS}" \
            --min-speed-cm-s "${MIN_SPEED_CM_S}" \
            --output "${out_dir}" \
            --continue-on-error

      - name: Upload model-evidence session/event shard
        uses: actions/upload-artifact@v7
        with:
          name: model-evidence-all-session-shard-${{ github.run_id }}-${{ matrix.event.global_shard_index }}
          path: results/model-evidence-${{ matrix.event.session_slug }}-shard-${{ matrix.event.event_shard_index }}/
          if-no-files-found: error

  aggregate:
    name: Aggregate all-session model evidence
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [plan-session-event-shards, model-evidence-shard]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Download model-evidence session/event shards
        uses: actions/download-artifact@v7
        with:
          pattern: model-evidence-all-session-shard-${{ github.run_id }}-*
          path: artifacts/model-evidence-all-session-shards

      - name: Aggregate all-session model-evidence shards
        run: |
          set -euo pipefail
          python scripts/aggregate_all_session_model_evidence.py \
            --shard-glob "artifacts/model-evidence-all-session-shards/**/event_model_evidence.csv" \
            --output results/all-session-model-evidence

      - name: Validate all-session aggregate output
        env:
          EXPECTED_EVENTS: ${{ needs.plan-session-event-shards.outputs.event_count }}
          EXPECTED_SESSIONS: ${{ needs.plan-session-event-shards.outputs.session_count }}
        run: |
          set -euo pipefail
          for required_file in \
            all_sessions_event_model_evidence.csv \
            all_sessions_model_evidence_summary.csv \
            all_sessions_best_model_counts.csv \
            session_model_evidence_summary.csv \
            session_best_model_counts.csv \
            random_effects_model_probabilities.csv \
            event_model_pivot_log_evidence.csv \
            event_model_pivot_relative_log_evidence.csv \
            event_model_pivot_model_probability.csv; do
            test -s "results/all-session-model-evidence/${required_file}" || {
              echo "Missing results/all-session-model-evidence/${required_file}" >&2
              exit 1
            }
          done
          python - <<'PY'
          import os
          import pandas as pd

          scores = pd.read_csv("results/all-session-model-evidence/all_sessions_event_model_evidence.csv")
          expected_events = int(os.environ["EXPECTED_EVENTS"])
          expected_sessions = int(os.environ["EXPECTED_SESSIONS"])
          expected_models = len(os.environ["MODELS"].split())
          observed_events = int(scores[["session", "event_index"]].drop_duplicates().shape[0])
          observed_sessions = int(scores["session"].nunique())
          expected_rows = expected_events * expected_models
          if observed_sessions != expected_sessions:
              raise SystemExit(f"Expected {expected_sessions} sessions, observed {observed_sessions}")
          if observed_events != expected_events:
              raise SystemExit(f"Expected {expected_events} session-events, observed {observed_events}")
          if len(scores) != expected_rows:
              raise SystemExit(f"Expected {expected_rows} rows, observed {len(scores)}")
          if "status" in scores and int((scores["status"] != "success").sum()) != 0:
              raise SystemExit("All-session model evidence contains failed rows")
          print(f"Validated {len(scores)} rows across {observed_sessions} sessions, {observed_events} events, and {expected_models} models.")
          PY

      - name: Show all-session model-evidence summary
        run: |
          python - <<'PY'
          import pandas as pd
          root = "results/all-session-model-evidence"
          print("All-session model-evidence summary:")
          print(pd.read_csv(f"{root}/all_sessions_model_evidence_summary.csv").to_string(index=False))
          print("\nSession model-evidence summary:")
          print(pd.read_csv(f"{root}/session_model_evidence_summary.csv").to_string(index=False))
          print("\nRandom-effects model probabilities:")
          print(pd.read_csv(f"{root}/random_effects_model_probabilities.csv").to_string(index=False))
          PY

      - name: Upload all-session model-evidence results
        uses: actions/upload-artifact@v7
        with:
          name: model-evidence-all-sessions-${{ github.run_id }}
          path: results/all-session-model-evidence/
          if-no-files-found: error
