---
name: Benchmark replay model evidence event-sharded

on:
  workflow_dispatch:
    inputs:
      dataset_root:
        description: "Dataset path after download or cache restore"
        required: true
        default: "data/DataSetFromPfeifferFoster"
      session:
        description: "Session ID, e.g. Rat1/Open1"
        required: true
        default: "Rat1/Open1"
      events:
        description: "Event IDs/ranges, all, run, or run:0-25"
        required: true
        default: "run"
      max_events:
        description: "Maximum selected events to score; empty means no cap"
        required: false
        default: ""
      models:
        description: "Space-separated models"
        required: true
        default: "sorted-spike-state-space-stationary sorted-spike-state-space-diffusion sorted-spike-state-space-fragmented sorted-spike-state-space-first-order-imm sorted-spike-state-space-momentum-exact-sparse sorted-spike-state-space-momentum sorted-spike-state-space-momentum-bidirectional sorted-spike-state-space-imm sorted-spike-state-space-goal sorted-spike-state-space-goal-bidirectional clusterless-state-space-stationary clusterless-state-space-diffusion clusterless-state-space-momentum clusterless-state-space-fragmented clusterless-state-space-imm"
      event_shard_count:
        description: "Target number of event shards"
        required: true
        default: "16"
      candidate_top_k:
        description: "Candidate spatial bins per time bin for candidate-pruned models"
        required: true
        default: "64"
      state_space_diffusion_sigma_cm_sqrt_s:
        description: "State-space diffusion noise in cm/sqrt(s)"
        required: true
        default: "85.0"
      state_space_max_step_sigma:
        description: "State-space Gaussian transition truncation radius in sigmas"
        required: true
        default: "4.0"
      state_space_valid_occupancy_threshold_s:
        description: "Minimum run occupancy in seconds for valid state-space bins; 0 keeps the full grid"
        required: true
        default: "0.0"
      state_space_momentum_sigma_cm_sqrt_s:
        description: "State-space momentum process noise in cm/sqrt(s)"
        required: true
        default: "85.0"
      state_space_momentum_initial_sigma_cm_sqrt_s:
        description: "State-space initial momentum transition noise in cm/sqrt(s)"
        required: true
        default: "85.0"
      state_space_momentum_velocity_decay:
        description: "State-space momentum velocity decay"
        required: true
        default: "0.95"
      state_space_momentum_velocity_decay_tau_s:
        description: "Optional state-space momentum velocity-decay time constant in seconds; 0 uses state_space_momentum_velocity_decay"
        required: true
        default: "0.000"
      state_space_momentum_candidate_source:
        description: "Momentum/IMM candidate source: emission or posterior"
        required: true
        default: "emission"
      state_space_momentum_candidate_top_k:
        description: "Emission top-k support for state-space momentum/IMM lower-bound recursions"
        required: true
        default: "256"
      state_space_momentum_predicted_candidate_top_k:
        description: "Top adjacent emission candidates used to augment second-order candidate support with momentum predictions"
        required: true
        default: "16"
      time_bin_s:
        description: "Ripple decoding time-bin width in seconds"
        required: true
        default: "0.003"
      spike_rate_scale:
        description: "Multiplicative scale applied to Poisson place-field rates during ripple scoring"
        required: true
        default: "1.0"
      emission_likelihood_temperature:
        description: "Sorted-spike emission likelihood temperature"
        required: true
        default: "1.0"
      emission_negative_binomial_overdispersion:
        description: "Sorted-spike negative-binomial overdispersion; 0 keeps Poisson emissions"
        required: true
        default: "0.0"
      bin_size_cm:
        description: "Place-field spatial bin size in centimeters"
        required: true
        default: "6.0"
      smoothing_sigma_bins:
        description: "Place-field smoothing sigma in spatial bins"
        required: true
        default: "2.0"
      min_speed_cm_s:
        description: "Minimum speed for place-field training in cm/s"
        required: true
        default: "5.0"
      local_cache_root:
        description: "Optional self-hosted persistent dataset cache path"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: model-evidence-event-sharded-${{ github.repository }}-${{ inputs.session }}-${{ inputs.events }}-${{ inputs.max_events }}-${{ inputs.spike_rate_scale }}-${{ inputs.emission_likelihood_temperature }}-${{ inputs.emission_negative_binomial_overdispersion }}-${{ inputs.state_space_valid_occupancy_threshold_s }}-${{ inputs.state_space_momentum_initial_sigma_cm_sqrt_s }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DATASET_ROOT: ${{ inputs.dataset_root }}
  SESSION: ${{ inputs.session }}
  EVENTS: ${{ inputs.events }}
  MAX_EVENTS: ${{ inputs.max_events }}
  MODELS: ${{ inputs.models }}
  EVENT_SHARD_COUNT: ${{ inputs.event_shard_count }}
  CANDIDATE_TOP_K: ${{ inputs.candidate_top_k }}
  STATIONARY_SIGMA_CM: "2.0"
  DIFFUSION_SIGMA_CM: "12.0"
  MOMENTUM_SIGMA_CM: "12.0"
  VELOCITY_DECAY: "0.95"
  MODE_STICKINESS: "0.94"
  STATE_SPACE_STATIONARY_SIGMA_CM: "2.0"
  STATE_SPACE_DIFFUSION_SIGMA_CM_SQRT_S: ${{ inputs.state_space_diffusion_sigma_cm_sqrt_s }}
  STATE_SPACE_MAX_STEP_SIGMA: ${{ inputs.state_space_max_step_sigma }}
  STATE_SPACE_IMM_MODE_STICKINESS: "0.95"
  STATE_SPACE_IMM_SWITCH_TAU_S: "0.060"
  STATE_SPACE_VALID_OCCUPANCY_THRESHOLD_S: ${{ inputs.state_space_valid_occupancy_threshold_s }}
  STATE_SPACE_MOMENTUM_SIGMA_CM_SQRT_S: ${{ inputs.state_space_momentum_sigma_cm_sqrt_s }}
  STATE_SPACE_MOMENTUM_INITIAL_SIGMA_CM_SQRT_S: ${{ inputs.state_space_momentum_initial_sigma_cm_sqrt_s }}
  STATE_SPACE_MOMENTUM_VELOCITY_DECAY: ${{ inputs.state_space_momentum_velocity_decay }}
  STATE_SPACE_MOMENTUM_VELOCITY_DECAY_TAU_S: ${{ inputs.state_space_momentum_velocity_decay_tau_s }}
  STATE_SPACE_MOMENTUM_CANDIDATE_SOURCE: ${{ inputs.state_space_momentum_candidate_source }}
  STATE_SPACE_COMMON_SUPPORT_TOP_K: "0"
  STATE_SPACE_MOMENTUM_CANDIDATE_TOP_K: ${{ inputs.state_space_momentum_candidate_top_k }}
  STATE_SPACE_MOMENTUM_CANDIDATE_MASS_THRESHOLD: ""
  STATE_SPACE_MOMENTUM_CANDIDATE_MIN_K: "1"
  STATE_SPACE_MOMENTUM_CANDIDATE_MAX_K: "0"
  STATE_SPACE_MOMENTUM_PREDICTED_CANDIDATE_TOP_K: ${{ inputs.state_space_momentum_predicted_candidate_top_k }}
  GOAL_STATE_SPACE_TRANSITION_SIGMA_CM_SQRT_S: "85.0"
  GOAL_STATE_SPACE_DRIFT_SPEED_CM_S: "400.0"
  GOAL_STATE_SPACE_MAX_STEP_SIGMA: "4.0"
  CLUSTERLESS_MARK_SMOOTHING_SIGMA_BINS: "1.0"
  CLUSTERLESS_MARK_PRIOR_COUNT: "1.0"
  CLUSTERLESS_MARK_VARIANCE_FLOOR: "1.0"
  CLUSTERLESS_RATE_FLOOR_HZ: "0.0001"
  CLUSTERLESS_MARK_LIKELIHOOD: "local-kde"
  CLUSTERLESS_MARK_KDE_BANDWIDTH: ""
  CLUSTERLESS_MARK_KDE_SPATIAL_SIGMA_BINS: ""
  CLUSTERLESS_MARK_KDE_MAX_NEIGHBORS: "256"
  TIME_BIN_S: ${{ inputs.time_bin_s }}
  SPIKE_RATE_SCALE: ${{ inputs.spike_rate_scale }}
  EMISSION_LIKELIHOOD_TEMPERATURE: ${{ inputs.emission_likelihood_temperature }}
  EMISSION_NEGATIVE_BINOMIAL_OVERDISPERSION: ${{ inputs.emission_negative_binomial_overdispersion }}
  BIN_SIZE_CM: ${{ inputs.bin_size_cm }}
  SMOOTHING_SIGMA_BINS: ${{ inputs.smoothing_sigma_bins }}
  MIN_SPEED_CM_S: ${{ inputs.min_speed_cm_s }}
  LOCAL_CACHE_ROOT: ${{ inputs.local_cache_root }}
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  plan-event-shards:
    name: Plan event shards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      event_matrix: ${{ steps.plan.outputs.event_matrix }}
      event_count: ${{ steps.plan.outputs.event_count }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Ensure Pfeiffer-Foster dataset
        id: dataset
        uses: ./.github/actions/ensure-pfeiffer-foster-dataset
        with:
          dataset-root: ${{ env.DATASET_ROOT }}
          session: ${{ env.SESSION }}
          cache-key: hipporeplayimm-dataset-${{ runner.os }}-rclone-v1
          local-cache-root: ${{ env.LOCAL_CACHE_ROOT }}
          webdav-url: ${{ secrets.PFEIFFERFOSTER_WEBDAV_URL }}
          webdav-key: ${{ secrets.PFEIFFERFOSTER_DATA_KEY }}
          webdav-password: ${{ secrets.PFEIFFERFOSTER_DATA_PASSWORD }}

      - name: Plan event shards
        id: plan
        run: |
          set -euo pipefail
          max_events_args=()
          if [ -n "${MAX_EVENTS}" ]; then
            max_events_args+=(--max-events "${MAX_EVENTS}")
          fi
          mkdir -p results/model-evidence-event-shard-plan
          python scripts/plan_model_evidence_event_shards.py \
            --dataset-root "${DATASET_ROOT}" \
            --session "${SESSION}" \
            --events "${EVENTS}" \
            --event-shard-count "${EVENT_SHARD_COUNT}" \
            "${max_events_args[@]}" \
            --output results/model-evidence-event-shard-plan/plan.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          plan = json.loads(Path("results/model-evidence-event-shard-plan/plan.json").read_text(encoding="utf-8"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"event_matrix={json.dumps(plan['event_matrix'], separators=(',', ':'))}\n")
              output.write(f"event_count={plan['event_count']}\n")
          print(f"Planned {plan['event_count']} events across {plan['event_shard_count']} event shards.")
          PY

      - name: Upload event-shard plan
        uses: actions/upload-artifact@v7
        with:
          name: model-evidence-event-shard-plan-${{ github.run_id }}
          path: results/model-evidence-event-shard-plan/
          if-no-files-found: error

  model-evidence-shard:
    name: Model evidence shard ${{ matrix.event.event_shard_index }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: plan-event-shards
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        event: ${{ fromJson(needs.plan-event-shards.outputs.event_matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Ensure Pfeiffer-Foster dataset
        id: dataset
        uses: ./.github/actions/ensure-pfeiffer-foster-dataset
        with:
          dataset-root: ${{ env.DATASET_ROOT }}
          session: ${{ env.SESSION }}
          cache-key: hipporeplayimm-dataset-${{ runner.os }}-rclone-v1
          local-cache-root: ${{ env.LOCAL_CACHE_ROOT }}
          webdav-url: ${{ secrets.PFEIFFERFOSTER_WEBDAV_URL }}
          webdav-key: ${{ secrets.PFEIFFERFOSTER_DATA_KEY }}
          webdav-password: ${{ secrets.PFEIFFERFOSTER_DATA_PASSWORD }}

      - name: Run model-evidence shard
        env:
          EVENT_SHARD_INDEX: ${{ matrix.event.event_shard_index }}
          SHARD_EVENTS: ${{ matrix.event.events_spec }}
        run: |
          set -euo pipefail
          out_dir="results/model-evidence-shard-${EVENT_SHARD_INDEX}"
          python scripts/benchmark_model_evidence.py \
            --dataset-root "${DATASET_ROOT}" \
            --session "${SESSION}" \
            --events "${SHARD_EVENTS}" \
            --models "${MODELS}" \
            --candidate-top-k "${CANDIDATE_TOP_K}" \
            --stationary-sigma-cm "${STATIONARY_SIGMA_CM}" \
            --diffusion-sigma-cm "${DIFFUSION_SIGMA_CM}" \
            --momentum-sigma-cm "${MOMENTUM_SIGMA_CM}" \
            --velocity-decay "${VELOCITY_DECAY}" \
            --mode-stickiness "${MODE_STICKINESS}" \
            --state-space-stationary-sigma-cm "${STATE_SPACE_STATIONARY_SIGMA_CM}" \
            --state-space-diffusion-sigma-cm-sqrt-s "${STATE_SPACE_DIFFUSION_SIGMA_CM_SQRT_S}" \
            --state-space-max-step-sigma "${STATE_SPACE_MAX_STEP_SIGMA}" \
            --state-space-imm-mode-stickiness "${STATE_SPACE_IMM_MODE_STICKINESS}" \
            --state-space-imm-switch-tau-s "${STATE_SPACE_IMM_SWITCH_TAU_S}" \
            --state-space-valid-occupancy-threshold-s "${STATE_SPACE_VALID_OCCUPANCY_THRESHOLD_S}" \
            --state-space-momentum-sigma-cm-sqrt-s "${STATE_SPACE_MOMENTUM_SIGMA_CM_SQRT_S}" \
            --state-space-momentum-initial-sigma-cm-sqrt-s "${STATE_SPACE_MOMENTUM_INITIAL_SIGMA_CM_SQRT_S}" \
            --state-space-momentum-velocity-decay "${STATE_SPACE_MOMENTUM_VELOCITY_DECAY}" \
            --state-space-momentum-velocity-decay-tau-s "${STATE_SPACE_MOMENTUM_VELOCITY_DECAY_TAU_S}" \
            --state-space-momentum-candidate-top-k "${STATE_SPACE_MOMENTUM_CANDIDATE_TOP_K}" \
            --state-space-momentum-candidate-mass-threshold "${STATE_SPACE_MOMENTUM_CANDIDATE_MASS_THRESHOLD}" \
            --state-space-momentum-candidate-min-k "${STATE_SPACE_MOMENTUM_CANDIDATE_MIN_K}" \
            --state-space-momentum-candidate-max-k "${STATE_SPACE_MOMENTUM_CANDIDATE_MAX_K}" \
            --state-space-momentum-predicted-candidate-top-k "${STATE_SPACE_MOMENTUM_PREDICTED_CANDIDATE_TOP_K}" \
            --state-space-momentum-candidate-source "${STATE_SPACE_MOMENTUM_CANDIDATE_SOURCE}" \
            --state-space-common-support-top-k "${STATE_SPACE_COMMON_SUPPORT_TOP_K}" \
            --goal-state-space-transition-sigma-cm-sqrt-s "${GOAL_STATE_SPACE_TRANSITION_SIGMA_CM_SQRT_S}" \
            --goal-state-space-drift-speed-cm-s "${GOAL_STATE_SPACE_DRIFT_SPEED_CM_S}" \
            --goal-state-space-max-step-sigma "${GOAL_STATE_SPACE_MAX_STEP_SIGMA}" \
            --clusterless-mark-smoothing-sigma-bins "${CLUSTERLESS_MARK_SMOOTHING_SIGMA_BINS}" \
            --clusterless-mark-prior-count "${CLUSTERLESS_MARK_PRIOR_COUNT}" \
            --clusterless-mark-variance-floor "${CLUSTERLESS_MARK_VARIANCE_FLOOR}" \
            --clusterless-rate-floor-hz "${CLUSTERLESS_RATE_FLOOR_HZ}" \
            --clusterless-mark-likelihood "${CLUSTERLESS_MARK_LIKELIHOOD}" \
            --clusterless-mark-kde-bandwidth "${CLUSTERLESS_MARK_KDE_BANDWIDTH}" \
            --clusterless-mark-kde-spatial-sigma-bins "${CLUSTERLESS_MARK_KDE_SPATIAL_SIGMA_BINS}" \
            --clusterless-mark-kde-max-neighbors "${CLUSTERLESS_MARK_KDE_MAX_NEIGHBORS}" \
            --time-bin-s "${TIME_BIN_S}" \
            --spike-rate-scale "${SPIKE_RATE_SCALE}" \
            --emission-likelihood-temperature "${EMISSION_LIKELIHOOD_TEMPERATURE}" \
            --emission-negative-binomial-overdispersion "${EMISSION_NEGATIVE_BINOMIAL_OVERDISPERSION}" \
            --bin-size-cm "${BIN_SIZE_CM}" \
            --smoothing-sigma-bins "${SMOOTHING_SIGMA_BINS}" \
            --min-speed-cm-s "${MIN_SPEED_CM_S}" \
            --output "${out_dir}" \
            --continue-on-error

      - name: Upload model-evidence shard
        uses: actions/upload-artifact@v7
        with:
          name: model-evidence-event-shard-${{ github.run_id }}-${{ matrix.event.event_shard_index }}
          path: results/model-evidence-shard-${{ matrix.event.event_shard_index }}/
          if-no-files-found: error

  aggregate:
    name: Aggregate model evidence
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [plan-event-shards, model-evidence-shard]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Download model-evidence shards
        uses: actions/download-artifact@v7
        with:
          pattern: model-evidence-event-shard-${{ github.run_id }}-*
          path: artifacts/model-evidence-shards

      - name: Aggregate model-evidence shards
        run: |
          set -euo pipefail
          python scripts/aggregate_model_evidence_shards.py \
            --shard-glob "artifacts/model-evidence-shards/**/event_model_evidence.csv" \
            --output results/model-evidence

      - name: Validate aggregate output
        env:
          EXPECTED_EVENTS: ${{ needs.plan-event-shards.outputs.event_count }}
        run: |
          set -euo pipefail
          for required_file in \
            event_model_evidence.csv \
            model_evidence_summary.csv \
            best_model_counts.csv \
            event_model_pivot_log_evidence.csv \
            event_model_pivot_relative_log_evidence.csv \
            event_model_pivot_model_probability.csv \
            result_quality_gate_summary.csv \
            result_quality_model_summary.csv; do
            test -s "results/model-evidence/${required_file}" || {
              echo "Missing results/model-evidence/${required_file}" >&2
              exit 1
            }
          done
          python - <<'PY'
          import os
          import pandas as pd

          scores = pd.read_csv("results/model-evidence/event_model_evidence.csv")
          expected_events = int(os.environ["EXPECTED_EVENTS"])
          expected_models = len(os.environ["MODELS"].split())
          observed_events = int(scores["event_index"].nunique())
          expected_rows = expected_events * expected_models
          if observed_events != expected_events:
              raise SystemExit(f"Expected {expected_events} events, observed {observed_events}")
          if len(scores) != expected_rows:
              raise SystemExit(f"Expected {expected_rows} rows, observed {len(scores)}")
          if "status" in scores and int((scores["status"] != "success").sum()) != 0:
              raise SystemExit("Event-sharded model evidence contains failed rows")
          print(f"Validated {len(scores)} rows across {observed_events} events and {expected_models} models.")
          PY

      - name: Show model-evidence summary
        run: |
          python - <<'PY'
          import pandas as pd
          scores = pd.read_csv("results/model-evidence/event_model_evidence.csv")
          summary = pd.read_csv("results/model-evidence/model_evidence_summary.csv")
          counts = pd.read_csv("results/model-evidence/best_model_counts.csv")
          gates = pd.read_csv("results/model-evidence/result_quality_gate_summary.csv")
          print(summary.to_string(index=False))
          print("\nBest-model counts:")
          print(counts.to_string(index=False))
          print("\nResult-quality gates:")
          print(gates.to_string(index=False))
          print("\nRows:", len(scores))
          print("Failures:", int((scores["status"] != "success").sum()) if "status" in scores else 0)
          PY

      - name: Upload model-evidence results
        uses: actions/upload-artifact@v7
        with:
          name: model-evidence-event-sharded-${{ github.run_id }}
          path: results/model-evidence/
          if-no-files-found: error
