---
name: Benchmark Pfeiffer-Foster replay model evidence

on:
  workflow_dispatch:
    inputs:
      dataset_root:
        description: "Dataset path after download"
        required: true
        default: "data/DataSetFromPfeifferFoster"
      session:
        description: "Session ID, e.g. Rat1/Open1"
        required: true
        default: "Rat1/Open1"
      events:
        description: "Event IDs/ranges, all, run, or run:0-25"
        required: true
        default: "0-25"
      max_events:
        description: "Maximum selected events to score; empty means no cap"
        required: false
        default: ""
      models:
        description: "Space-separated models"
        required: true
        default: "random stationary stationary-gaussian diffusion momentum imm"
      candidate_top_k:
        description: "Candidate spatial bins per time bin"
        required: true
        default: "64"
      stationary_sigma_cm:
        description: "Gaussian stationary transition sigma in cm"
        required: true
        default: "2.0"
      diffusion_sigma_cm:
        description: "Diffusion transition sigma in cm"
        required: true
        default: "12.0"
      momentum_sigma_cm:
        description: "Momentum transition sigma in cm"
        required: true
        default: "12.0"
      velocity_decay:
        description: "Momentum velocity decay"
        required: true
        default: "0.95"
      mode_stickiness:
        description: "IMM mode-transition stickiness"
        required: true
        default: "0.94"
      state_space_stationary_sigma_cm:
        description: "State-space stationary transition sigma in cm"
        required: true
        default: "2.0"
      state_space_diffusion_sigma_cm_sqrt_s:
        description: "State-space diffusion noise in cm/sqrt(s)"
        required: true
        default: "85.0"
      state_space_max_step_sigma:
        description: "State-space Gaussian transition truncation radius in sigmas"
        required: true
        default: "4.0"
      state_space_imm_mode_stickiness:
        description: "State-space IMM mode-transition stickiness"
        required: true
        default: "0.95"
      state_space_momentum_sigma_cm_sqrt_s:
        description: "State-space momentum process noise in cm/sqrt(s)"
        required: true
        default: "85.0"
      state_space_momentum_velocity_decay:
        description: "State-space momentum velocity decay"
        required: true
        default: "0.95"
      goal_state_space_active_goal_prior_weight:
        description: "Goal-state-space prior probability assigned to the task well active at ripple peak; 0 disables the prior"
        required: true
        default: "0.0"
      goal_state_space_reset_probability:
        description: "Goal-state-space per-bin uniform position reset probability; 0 disables resets"
        required: true
        default: "0.0"
      goal_state_space_lateral_sigma_scale:
        description: "Goal-state-space transition noise scale perpendicular to the source-goal axis; 1 keeps isotropic transitions"
        required: true
        default: "1.0"
      goal_state_space_diffusion_mixture_weight:
        description: "Goal-state-space transition mixture weight for zero-drift diffusion"
        required: true
        default: "0.0"
      goal_state_space_reset_initial_position_prior_weight:
        description: "Goal-state-space reset destination blend toward the event initial-position prior"
        required: true
        default: "0.0"
      goal_state_space_component_switch_probability:
        description: "Goal-state-space per-transition latent goal/direction component switch probability"
        required: true
        default: "0.0"
      goal_state_space_initial_position_prior_direction_mode:
        description: "Goal-state-space components receiving the ripple-position initial prior: all, toward, or away"
        required: true
        default: "all"
      goal_state_space_terminal_prior_sigma_cm:
        description: "Goal-state-space terminal goal prior sigma in cm; 0 disables the terminal prior"
        required: true
        default: "0.0"
      goal_state_space_terminal_goal_prior_weight:
        description: "Goal-state-space terminal goal prior factor blend weight"
        required: true
        default: "1.0"
      goal_state_space_initial_goal_prior_sigma_cm:
        description: "Goal-state-space initial goal prior sigma in cm for away/reverse components; 0 disables the prior"
        required: true
        default: "0.0"
      goal_state_space_initial_goal_prior_weight:
        description: "Goal-state-space initial goal prior factor blend weight"
        required: true
        default: "1.0"
      goal_state_space_toward_direction_prior_weight:
        description: "Goal-state-space bidirectional prior weight for toward-goal components"
        required: true
        default: "0.5"
      goal_state_space_ripple_position_prior_sigma_cm:
        description: "Goal-state-space Gaussian initial-position prior sigma around ripple-peak position; 0 disables the prior"
        required: true
        default: "0.0"
      goal_state_space_ripple_position_prior_weight:
        description: "Goal-state-space ripple-position initial-prior mixture weight; 1 uses the full Gaussian prior"
        required: true
        default: "1.0"
      goal_state_space_reverse_terminal_position_prior_sigma_cm:
        description: "Goal-state-space reverse terminal position prior sigma around ripple-peak position; 0 disables the prior"
        required: true
        default: "0.0"
      goal_state_space_reverse_terminal_position_prior_weight:
        description: "Goal-state-space reverse terminal position prior mixture weight"
        required: true
        default: "1.0"
      time_bin_s:
        description: "Ripple decoding time-bin width in seconds"
        required: true
        default: "0.02"
      spike_rate_scale:
        description: "Multiplicative scale applied to Poisson place-field rates during ripple scoring"
        required: true
        default: "1.0"
      bin_size_cm:
        description: "Place-field spatial bin size in centimeters"
        required: true
        default: "6.0"
      smoothing_sigma_bins:
        description: "Place-field smoothing sigma in spatial bins"
        required: true
        default: "2.0"
      min_speed_cm_s:
        description: "Minimum speed for place-field training in cm/s"
        required: true
        default: "5.0"

permissions:
  contents: read

env:
  DATASET_ROOT: ${{ inputs.dataset_root }}
  SESSION: ${{ inputs.session }}
  EVENTS: ${{ inputs.events }}
  MAX_EVENTS: ${{ inputs.max_events }}
  MODELS: ${{ inputs.models }}
  CANDIDATE_TOP_K: ${{ inputs.candidate_top_k }}
  STATIONARY_SIGMA_CM: ${{ inputs.stationary_sigma_cm }}
  DIFFUSION_SIGMA_CM: ${{ inputs.diffusion_sigma_cm }}
  MOMENTUM_SIGMA_CM: ${{ inputs.momentum_sigma_cm }}
  VELOCITY_DECAY: ${{ inputs.velocity_decay }}
  MODE_STICKINESS: ${{ inputs.mode_stickiness }}
  STATE_SPACE_STATIONARY_SIGMA_CM: ${{ inputs.state_space_stationary_sigma_cm }}
  STATE_SPACE_DIFFUSION_SIGMA_CM_SQRT_S: ${{ inputs.state_space_diffusion_sigma_cm_sqrt_s }}
  STATE_SPACE_MAX_STEP_SIGMA: ${{ inputs.state_space_max_step_sigma }}
  STATE_SPACE_IMM_MODE_STICKINESS: ${{ inputs.state_space_imm_mode_stickiness }}
  STATE_SPACE_MOMENTUM_SIGMA_CM_SQRT_S: ${{ inputs.state_space_momentum_sigma_cm_sqrt_s }}
  STATE_SPACE_MOMENTUM_INITIAL_SIGMA_CM_SQRT_S: "85.0"
  STATE_SPACE_MOMENTUM_VELOCITY_DECAY: ${{ inputs.state_space_momentum_velocity_decay }}
  STATE_SPACE_MOMENTUM_CANDIDATE_TOP_K: "128"
  GOAL_STATE_SPACE_TRANSITION_SIGMA_CM_SQRT_S: "85.0"
  GOAL_STATE_SPACE_DRIFT_SPEED_CM_S: "400.0"
  GOAL_STATE_SPACE_LATERAL_SIGMA_SCALE: ${{ inputs.goal_state_space_lateral_sigma_scale }}
  GOAL_STATE_SPACE_DIFFUSION_MIXTURE_WEIGHT: ${{ inputs.goal_state_space_diffusion_mixture_weight }}
  GOAL_STATE_SPACE_MAX_STEP_SIGMA: "4.0"
  GOAL_STATE_SPACE_RESET_PROBABILITY: ${{ inputs.goal_state_space_reset_probability }}
  GOAL_STATE_SPACE_RESET_INITIAL_POSITION_PRIOR_WEIGHT: ${{ inputs.goal_state_space_reset_initial_position_prior_weight }}
  GOAL_STATE_SPACE_COMPONENT_SWITCH_PROBABILITY: ${{ inputs.goal_state_space_component_switch_probability }}
  GOAL_STATE_SPACE_INITIAL_POSITION_PRIOR_DIRECTION_MODE: ${{ inputs.goal_state_space_initial_position_prior_direction_mode }}
  GOAL_STATE_SPACE_TERMINAL_PRIOR_SIGMA_CM: ${{ inputs.goal_state_space_terminal_prior_sigma_cm }}
  GOAL_STATE_SPACE_TERMINAL_GOAL_PRIOR_WEIGHT: ${{ inputs.goal_state_space_terminal_goal_prior_weight }}
  GOAL_STATE_SPACE_INITIAL_GOAL_PRIOR_SIGMA_CM: ${{ inputs.goal_state_space_initial_goal_prior_sigma_cm }}
  GOAL_STATE_SPACE_INITIAL_GOAL_PRIOR_WEIGHT: ${{ inputs.goal_state_space_initial_goal_prior_weight }}
  GOAL_STATE_SPACE_TOWARD_DIRECTION_PRIOR_WEIGHT: ${{ inputs.goal_state_space_toward_direction_prior_weight }}
  GOAL_STATE_SPACE_ACTIVE_GOAL_PRIOR_WEIGHT: ${{ inputs.goal_state_space_active_goal_prior_weight }}
  GOAL_STATE_SPACE_RIPPLE_POSITION_PRIOR_SIGMA_CM: ${{ inputs.goal_state_space_ripple_position_prior_sigma_cm }}
  GOAL_STATE_SPACE_RIPPLE_POSITION_PRIOR_WEIGHT: ${{ inputs.goal_state_space_ripple_position_prior_weight }}
  GOAL_STATE_SPACE_REVERSE_TERMINAL_POSITION_PRIOR_SIGMA_CM: ${{ inputs.goal_state_space_reverse_terminal_position_prior_sigma_cm }}
  GOAL_STATE_SPACE_REVERSE_TERMINAL_POSITION_PRIOR_WEIGHT: ${{ inputs.goal_state_space_reverse_terminal_position_prior_weight }}
  CLUSTERLESS_MARK_SMOOTHING_SIGMA_BINS: "1.0"
  CLUSTERLESS_MARK_PRIOR_COUNT: "1.0"
  CLUSTERLESS_MARK_VARIANCE_FLOOR: "1.0"
  TIME_BIN_S: ${{ inputs.time_bin_s }}
  SPIKE_RATE_SCALE: ${{ inputs.spike_rate_scale }}
  BIN_SIZE_CM: ${{ inputs.bin_size_cm }}
  SMOOTHING_SIGMA_BINS: ${{ inputs.smoothing_sigma_bins }}
  MIN_SPEED_CM_S: ${{ inputs.min_speed_cm_s }}

jobs:
  model-evidence:
    name: Replay model-evidence benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Ensure Pfeiffer-Foster dataset
        id: dataset
        uses: ./.github/actions/ensure-pfeiffer-foster-dataset
        with:
          dataset-root: ${{ env.DATASET_ROOT }}
          session: ${{ env.SESSION }}
          cache-key: hipporeplayimm-dataset-${{ runner.os }}-rclone-v1
          webdav-url: ${{ secrets.PFEIFFERFOSTER_WEBDAV_URL }}
          webdav-key: ${{ secrets.PFEIFFERFOSTER_DATA_KEY }}
          webdav-password: ${{ secrets.PFEIFFERFOSTER_DATA_PASSWORD }}

      - name: Run model-evidence benchmark
        run: |
          set -euo pipefail
          max_events_args=()
          if [ -n "${MAX_EVENTS}" ]; then
            max_events_args+=(--max-events "${MAX_EVENTS}")
          fi
          python scripts/benchmark_model_evidence.py \
            --dataset-root "${DATASET_ROOT}" \
            --session "${SESSION}" \
            --events "${EVENTS}" \
            "${max_events_args[@]}" \
            --models "${MODELS}" \
            --candidate-top-k "${CANDIDATE_TOP_K}" \
            --stationary-sigma-cm "${STATIONARY_SIGMA_CM}" \
            --diffusion-sigma-cm "${DIFFUSION_SIGMA_CM}" \
            --momentum-sigma-cm "${MOMENTUM_SIGMA_CM}" \
            --velocity-decay "${VELOCITY_DECAY}" \
            --mode-stickiness "${MODE_STICKINESS}" \
            --state-space-stationary-sigma-cm "${STATE_SPACE_STATIONARY_SIGMA_CM}" \
            --state-space-diffusion-sigma-cm-sqrt-s "${STATE_SPACE_DIFFUSION_SIGMA_CM_SQRT_S}" \
            --state-space-max-step-sigma "${STATE_SPACE_MAX_STEP_SIGMA}" \
            --state-space-imm-mode-stickiness "${STATE_SPACE_IMM_MODE_STICKINESS}" \
            --state-space-momentum-sigma-cm-sqrt-s "${STATE_SPACE_MOMENTUM_SIGMA_CM_SQRT_S}" \
            --state-space-momentum-initial-sigma-cm-sqrt-s "${STATE_SPACE_MOMENTUM_INITIAL_SIGMA_CM_SQRT_S}" \
            --state-space-momentum-velocity-decay "${STATE_SPACE_MOMENTUM_VELOCITY_DECAY}" \
            --state-space-momentum-candidate-top-k "${STATE_SPACE_MOMENTUM_CANDIDATE_TOP_K}" \
            --goal-state-space-transition-sigma-cm-sqrt-s "${GOAL_STATE_SPACE_TRANSITION_SIGMA_CM_SQRT_S}" \
            --goal-state-space-drift-speed-cm-s "${GOAL_STATE_SPACE_DRIFT_SPEED_CM_S}" \
            --goal-state-space-lateral-sigma-scale "${GOAL_STATE_SPACE_LATERAL_SIGMA_SCALE}" \
            --goal-state-space-diffusion-mixture-weight "${GOAL_STATE_SPACE_DIFFUSION_MIXTURE_WEIGHT}" \
            --goal-state-space-max-step-sigma "${GOAL_STATE_SPACE_MAX_STEP_SIGMA}" \
            --goal-state-space-reset-probability "${GOAL_STATE_SPACE_RESET_PROBABILITY}" \
            --goal-state-space-reset-initial-position-prior-weight "${GOAL_STATE_SPACE_RESET_INITIAL_POSITION_PRIOR_WEIGHT}" \
            --goal-state-space-component-switch-probability "${GOAL_STATE_SPACE_COMPONENT_SWITCH_PROBABILITY}" \
            --goal-state-space-initial-position-prior-direction-mode "${GOAL_STATE_SPACE_INITIAL_POSITION_PRIOR_DIRECTION_MODE}" \
            --goal-state-space-terminal-prior-sigma-cm "${GOAL_STATE_SPACE_TERMINAL_PRIOR_SIGMA_CM}" \
            --goal-state-space-terminal-goal-prior-weight "${GOAL_STATE_SPACE_TERMINAL_GOAL_PRIOR_WEIGHT}" \
            --goal-state-space-initial-goal-prior-sigma-cm "${GOAL_STATE_SPACE_INITIAL_GOAL_PRIOR_SIGMA_CM}" \
            --goal-state-space-initial-goal-prior-weight "${GOAL_STATE_SPACE_INITIAL_GOAL_PRIOR_WEIGHT}" \
            --goal-state-space-toward-direction-prior-weight "${GOAL_STATE_SPACE_TOWARD_DIRECTION_PRIOR_WEIGHT}" \
            --goal-state-space-active-goal-prior-weight "${GOAL_STATE_SPACE_ACTIVE_GOAL_PRIOR_WEIGHT}" \
            --goal-state-space-ripple-position-prior-sigma-cm "${GOAL_STATE_SPACE_RIPPLE_POSITION_PRIOR_SIGMA_CM}" \
            --goal-state-space-ripple-position-prior-weight "${GOAL_STATE_SPACE_RIPPLE_POSITION_PRIOR_WEIGHT}" \
            --goal-state-space-reverse-terminal-position-prior-sigma-cm "${GOAL_STATE_SPACE_REVERSE_TERMINAL_POSITION_PRIOR_SIGMA_CM}" \
            --goal-state-space-reverse-terminal-position-prior-weight "${GOAL_STATE_SPACE_REVERSE_TERMINAL_POSITION_PRIOR_WEIGHT}" \
            --clusterless-mark-smoothing-sigma-bins "${CLUSTERLESS_MARK_SMOOTHING_SIGMA_BINS}" \
            --clusterless-mark-prior-count "${CLUSTERLESS_MARK_PRIOR_COUNT}" \
            --clusterless-mark-variance-floor "${CLUSTERLESS_MARK_VARIANCE_FLOOR}" \
            --time-bin-s "${TIME_BIN_S}" \
            --spike-rate-scale "${SPIKE_RATE_SCALE}" \
            --bin-size-cm "${BIN_SIZE_CM}" \
            --smoothing-sigma-bins "${SMOOTHING_SIGMA_BINS}" \
            --min-speed-cm-s "${MIN_SPEED_CM_S}" \
            --output results/model-evidence \
            --continue-on-error

      - name: Show model-evidence summary
        if: always()
        run: |
          if [ -f results/model-evidence/model_evidence_summary.csv ]; then
            python - <<'PY'
          import pandas as pd
          scores = pd.read_csv("results/model-evidence/event_model_evidence.csv")
          summary = pd.read_csv("results/model-evidence/model_evidence_summary.csv")
          counts = pd.read_csv("results/model-evidence/best_model_counts.csv")
          print(summary.to_string(index=False))
          print("\nBest-model counts:")
          print(counts.to_string(index=False))
          print("\nRows:", len(scores))
          if "status" in scores.columns:
              print("Failures:", int((scores["status"] != "success").sum()))
          PY
          else
            echo "No model-evidence summary was generated."
          fi

      - name: Upload model-evidence results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: model-evidence-${{ github.run_id }}
          path: results/model-evidence/
          if-no-files-found: error
