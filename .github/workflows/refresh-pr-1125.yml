---
name: Refresh PR 1125

"on":
  pull_request:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  merge-main:
    if: github.head_ref == 'agent/preserve-model-endpoint-scope-integers'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/preserve-model-endpoint-scope-integers
          fetch-depth: 0
      - name: Merge current main and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-commit --no-ff origin/main
          rm .github/workflows/refresh-pr-1125.yml
          git add -A
          git commit -m "Merge current main into exact endpoint scope fix"
          git push origin HEAD:agent/preserve-model-endpoint-scope-integers
