---
name: Replay behavior alignment self-hosted

on:
  workflow_dispatch:
    inputs:
      evidence_run_id:
        description: "Optional model-evidence run ID; leave blank to use the newest unexpired artifact"
        required: false
        default: ""
      evidence_artifact_name:
        description: "Optional model-evidence artifact name; required when evidence_run_id is set"
        required: false
        default: ""
  push:
    paths:
      - "docs/replay_behavior_alignment_trigger.txt"
      - ".github/workflows/replay-behavior-alignment-selfhosted.yml"

permissions:
  contents: read
  actions: read

jobs:
  replay-behavior-alignment:
    runs-on: self-hosted
    timeout-minutes: 120
    env:
      DATASET_ROOT: /home/github-runner/.cache/datasets/hipporeplayimm/pfeiffer-foster
      EVIDENCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.evidence_run_id || '' }}
      EVIDENCE_ARTIFACT_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.evidence_artifact_name || '' }}
      FUTURE_HORIZON_S: "2.0"
      PREVIOUS_HORIZON_S: "2.0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Validate local dataset
        run: |
          set -euo pipefail
          python .github/actions/ensure-pfeiffer-foster-dataset/validate_dataset.py \
            --dataset-root "${DATASET_ROOT}" \
            --session Rat1/Open1 \
            --write-manifest \
            --manifest-output results/replay-behavior-alignment/dataset_manifest.json

      - name: Resolve model-evidence artifact
        id: evidence
        uses: actions/github-script@v7
        env:
          REQUESTED_RUN_ID: ${{ env.EVIDENCE_RUN_ID }}
          REQUESTED_ARTIFACT_NAME: ${{ env.EVIDENCE_ARTIFACT_NAME }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const requestedRunId = process.env.REQUESTED_RUN_ID.trim();
            const requestedName = process.env.REQUESTED_ARTIFACT_NAME.trim();
            let artifact;
            let runId;

            if (requestedRunId || requestedName) {
              if (!requestedRunId || !requestedName) {
                core.setFailed(
                  "evidence_run_id and evidence_artifact_name must either both be set or both be blank"
                );
                return;
              }
              const artifacts = await github.paginate(
                github.rest.actions.listWorkflowRunArtifacts,
                {
                  owner,
                  repo,
                  run_id: Number(requestedRunId),
                  per_page: 100,
                }
              );
              artifact = artifacts.find((candidate) => candidate.name === requestedName);
              if (!artifact) {
                core.setFailed(`Artifact ${requestedName} was not found in run ${requestedRunId}`);
                return;
              }
              if (artifact.expired) {
                core.setFailed(`Artifact ${requestedName} in run ${requestedRunId} has expired`);
                return;
              }
              runId = requestedRunId;
            } else {
              const artifacts = await github.paginate(
                github.rest.actions.listArtifactsForRepo,
                { owner, repo, per_page: 100 }
              );
              artifact = artifacts
                .filter(
                  (candidate) =>
                    !candidate.expired &&
                    candidate.name.startsWith("model-evidence-all-sessions-") &&
                    candidate.workflow_run?.id
                )
                .sort((left, right) => new Date(right.created_at) - new Date(left.created_at))[0];
              if (!artifact) {
                core.setFailed("No unexpired model-evidence-all-sessions artifact was found");
                return;
              }
              runId = String(artifact.workflow_run.id);
            }

            core.info(`Using ${artifact.name} from workflow run ${runId}`);
            core.setOutput("run_id", String(runId));
            core.setOutput("artifact_name", artifact.name);

      - name: Download model-evidence artifact
        uses: actions/download-artifact@v7
        with:
          run-id: ${{ steps.evidence.outputs.run_id }}
          name: ${{ steps.evidence.outputs.artifact_name }}
          path: artifacts/model-evidence
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}

      - name: Run behavior alignment
        run: |
          set -euo pipefail
          event_csv="$(find artifacts/model-evidence -name all_sessions_event_model_evidence.csv -print -quit)"
          if [ -z "${event_csv}" ]; then
            event_csv="$(find artifacts/model-evidence -name event_model_evidence.csv -print -quit)"
          fi
          if [ -z "${event_csv}" ]; then
            echo "Could not find an event evidence CSV in the downloaded artifact" >&2
            find artifacts/model-evidence -maxdepth 3 -type f | sort >&2 || true
            exit 1
          fi
          mkdir -p results/replay-behavior-alignment
          python scripts/replay_behavior_alignment.py \
            --event-model-evidence "${event_csv}" \
            --dataset-root "${DATASET_ROOT}" \
            --future-horizon-s "${FUTURE_HORIZON_S}" \
            --previous-horizon-s "${PREVIOUS_HORIZON_S}" \
            --output results/replay-behavior-alignment
          test -s results/replay-behavior-alignment/replay_behavior_alignment.csv
          test -s results/replay-behavior-alignment/future_path_prediction_summary.csv
          test -s results/replay-behavior-alignment/rat_behavior_alignment_summary.csv
          test -s results/replay-behavior-alignment/leave_one_rat_out_behavior_prediction.csv

      - name: Print summaries
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          root = Path('results/replay-behavior-alignment')
          for name in ['future_path_prediction_summary.csv', 'rat_behavior_alignment_summary.csv', 'leave_one_rat_out_behavior_prediction.csv']:
              print('\n##', name)
              print(pd.read_csv(root / name).to_string(index=False))
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: replay-behavior-alignment-${{ github.run_id }}
          path: results/replay-behavior-alignment
          if-no-files-found: error
