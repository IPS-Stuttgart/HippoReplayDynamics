---
name: Replay behavior alignment

on:
  workflow_dispatch:
    inputs:
      evidence_run_id:
        description: "Optional model-evidence run ID; blank selects the newest unexpired artifact"
        required: false
        default: ""
      evidence_artifact_name:
        description: "Optional model-evidence artifact name; blank selects model-evidence-all-sessions-*"
        required: false
        default: ""
      dataset_root:
        description: "Dataset path after download or cache restore"
        required: true
        default: "data/DataSetFromPfeifferFoster"
      future_horizon_s:
        description: "Seconds after event peak for future movement vector"
        required: true
        default: "2.0"
      previous_horizon_s:
        description: "Seconds before event peak for previous movement vector"
        required: true
        default: "2.0"
  push:
    branches:
      - main
    paths:
      - "docs/replay_behavior_alignment_trigger.txt"
      - "scripts/replay_behavior_alignment.py"

permissions:
  contents: read
  actions: read

env:
  EVIDENCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.evidence_run_id || '' }}
  EVIDENCE_ARTIFACT_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.evidence_artifact_name || '' }}
  DATASET_ROOT: ${{ github.event_name == 'workflow_dispatch' && inputs.dataset_root || 'data/DataSetFromPfeifferFoster' }}
  FUTURE_HORIZON_S: ${{ github.event_name == 'workflow_dispatch' && inputs.future_horizon_s || '2.0' }}
  PREVIOUS_HORIZON_S: ${{ github.event_name == 'workflow_dispatch' && inputs.previous_horizon_s || '2.0' }}
  LOCAL_CACHE_ROOT: ${{ vars.PFEIFFERFOSTER_LOCAL_CACHE_ROOT }}
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  replay-behavior-alignment:
    name: Replay behavior alignment
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Ensure Pfeiffer-Foster dataset
        id: dataset
        uses: ./.github/actions/ensure-pfeiffer-foster-dataset
        with:
          dataset-root: ${{ env.DATASET_ROOT }}
          session: Rat1/Open1
          cache-key: hipporeplayimm-dataset-${{ runner.os }}-rclone-v1
          local-cache-root: ${{ env.LOCAL_CACHE_ROOT }}
          webdav-url: ${{ secrets.PFEIFFERFOSTER_WEBDAV_URL }}
          webdav-key: ${{ secrets.PFEIFFERFOSTER_DATA_KEY }}
          webdav-password: ${{ secrets.PFEIFFERFOSTER_DATA_PASSWORD }}

      - name: Resolve model-evidence artifact
        id: evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/resolve_model_evidence_artifact.py \
            --repository "${GITHUB_REPOSITORY}" \
            --run-id "${EVIDENCE_RUN_ID}" \
            --artifact-name "${EVIDENCE_ARTIFACT_NAME}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Download model-evidence artifact
        uses: actions/download-artifact@v7
        with:
          run-id: ${{ steps.evidence.outputs.run_id }}
          name: ${{ steps.evidence.outputs.artifact_name }}
          path: artifacts/model-evidence
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}

      - name: Run replay behavior alignment
        env:
          RESOLVED_EVIDENCE_ARTIFACT_NAME: ${{ steps.evidence.outputs.artifact_name }}
        run: |
          set -euo pipefail
          event_csv="$(find artifacts/model-evidence -name all_sessions_event_model_evidence.csv -print -quit)"
          if [ -z "${event_csv}" ]; then
            event_csv="$(find artifacts/model-evidence -name event_model_evidence.csv -print -quit)"
          fi
          if [ -z "${event_csv}" ]; then
            echo "Could not find event evidence CSV in ${RESOLVED_EVIDENCE_ARTIFACT_NAME}" >&2
            find artifacts/model-evidence -maxdepth 3 -type f | sort >&2 || true
            exit 1
          fi

          mkdir -p results/replay-behavior-alignment
          python scripts/replay_behavior_alignment.py \
            --event-model-evidence "${event_csv}" \
            --dataset-root "${DATASET_ROOT}" \
            --future-horizon-s "${FUTURE_HORIZON_S}" \
            --previous-horizon-s "${PREVIOUS_HORIZON_S}" \
            --output results/replay-behavior-alignment

          test -s results/replay-behavior-alignment/replay_behavior_alignment.csv
          test -s results/replay-behavior-alignment/future_path_prediction_summary.csv
          test -s results/replay-behavior-alignment/rat_behavior_alignment_summary.csv
          test -s results/replay-behavior-alignment/leave_one_rat_out_behavior_prediction.csv

      - name: Print behavior alignment summaries
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          root = Path("results/replay-behavior-alignment")
          for name in [
              "future_path_prediction_summary.csv",
              "rat_behavior_alignment_summary.csv",
              "leave_one_rat_out_behavior_prediction.csv",
          ]:
              path = root / name
              print(f"\n## {name}")
              print(pd.read_csv(path).to_string(index=False))
          PY

      - name: Upload replay behavior alignment results
        uses: actions/upload-artifact@v7
        with:
          name: replay-behavior-alignment-${{ github.run_id }}
          path: results/replay-behavior-alignment
          if-no-files-found: error
