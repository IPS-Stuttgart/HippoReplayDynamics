---
name: Spike-matched event-window null controls

on:
  workflow_dispatch:
    inputs:
      dataset_root:
        description: "Dataset path after download or cache restore"
        required: true
        default: "data/DataSetFromPfeifferFoster"
      sessions:
        description: "Space- or comma-separated sessions"
        required: true
        default: "Rat1/Open1 Rat1/Open2 Rat2/Open1 Rat2/Open2 Rat3/Open1 Rat3/Open2 Rat4/Open1 Rat4/Open2"
      comparison_scope:
        description: "Family comparison scope: auto, full-core, or lightweight-first-order-imm-vs-stationary"
        required: false
        default: "auto"
      session_filter:
        description: "Optional whitespace-separated sessions to score; empty means all default sessions"
        required: false
        default: ""
      event_index_filter:
        description: "Optional whitespace/comma-separated event indices to score within each selected session; empty means use max_events selection"
        required: false
        default: ""
      events:
        description: "Event IDs/ranges, all, run, or run:0-25"
        required: true
        default: "run"
      max_events:
        description: "Maximum selected events per session; empty means no cap"
        required: false
        default: "10"
      event_shard_count:
        description: "Target event shards per session"
        required: true
        default: "16"
      nulls_per_event:
        description: "Spike-matched off-SWR null windows per real event"
        required: true
        default: "10"
      null_count:
        description: "Optional override for nulls_per_event, useful for lightweight high-K pilots"
        required: false
        default: ""
      events_per_session_for_k50:
        description: "Optional event cap per session for lightweight K=50 pilots; overrides max_events when set"
        required: false
        default: ""
      spike_count_tolerance_fraction:
        description: "Preferred null spike-count tolerance around the real event"
        required: true
        default: "0.10"
      null_random_seed:
        description: "Random seed for null-window tie breaks and bootstrap"
        required: true
        default: "1"
      models:
        description: "Space-separated models"
        required: true
        default: "sorted-spike-state-space-stationary sorted-spike-state-space-diffusion sorted-spike-state-space-fragmented sorted-spike-state-space-first-order-imm sorted-spike-state-space-momentum-exact-sparse sorted-spike-state-space-momentum sorted-spike-state-space-imm"
      null_models:
        description: "Optional model-list override for lightweight null pilots"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: spike-matched-event-window-null-${{ github.repository }}-${{ inputs.sessions }}-${{ inputs.session_filter }}-${{ inputs.events }}-${{ inputs.event_index_filter }}-${{ inputs.max_events }}-${{ inputs.events_per_session_for_k50 }}-${{ inputs.nulls_per_event }}-${{ inputs.null_count }}-${{ inputs.comparison_scope }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DATASET_ROOT: ${{ inputs.dataset_root }}
  SESSIONS: ${{ inputs.sessions }}
  COMPARISON_SCOPE: ${{ inputs.comparison_scope }}
  SESSION_FILTER: ${{ inputs.session_filter }}
  EVENT_INDEX_FILTER: ${{ inputs.event_index_filter }}
  EVENTS: ${{ inputs.events }}
  MAX_EVENTS: ${{ inputs.max_events }}
  EVENTS_PER_SESSION_FOR_K50: ${{ inputs.events_per_session_for_k50 }}
  EVENT_SHARD_COUNT: ${{ inputs.event_shard_count }}
  NULLS_PER_EVENT: ${{ inputs.nulls_per_event }}
  NULL_COUNT: ${{ inputs.null_count }}
  SPIKE_COUNT_TOLERANCE_FRACTION: ${{ inputs.spike_count_tolerance_fraction }}
  NULL_RANDOM_SEED: ${{ inputs.null_random_seed }}
  MODELS: ${{ inputs.models }}
  NULL_MODELS: ${{ inputs.null_models }}
  LOCAL_CACHE_ROOT: ${{ vars.PFEIFFERFOSTER_LOCAL_CACHE_ROOT }}
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  plan-session-event-shards:
    name: Plan matched-null shards
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      event_matrix: ${{ steps.plan.outputs.event_matrix }}
      event_count: ${{ steps.plan.outputs.event_count }}
      session_count: ${{ steps.plan.outputs.session_count }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Ensure Pfeiffer-Foster dataset
        uses: ./.github/actions/ensure-pfeiffer-foster-dataset
        with:
          dataset-root: ${{ env.DATASET_ROOT }}
          session: Rat1/Open1
          cache-key: hipporeplayimm-dataset-${{ runner.os }}-rclone-v1
          local-cache-root: ${{ env.LOCAL_CACHE_ROOT }}
          webdav-url: ${{ secrets.PFEIFFERFOSTER_WEBDAV_URL }}
          webdav-key: ${{ secrets.PFEIFFERFOSTER_DATA_KEY }}
          webdav-password: ${{ secrets.PFEIFFERFOSTER_DATA_PASSWORD }}

      - name: Plan session/event shards
        id: plan
        run: |
          set -euo pipefail
          mkdir -p results/spike-matched-event-window-null-plan
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          sessions_text = os.environ.get("SESSION_FILTER", "").strip() or os.environ["SESSIONS"].strip()
          sessions = [s for s in re.split(r"[\s,]+", sessions_text) if s]
          if not sessions:
              raise SystemExit("No sessions selected")
          events_spec = os.environ.get("EVENT_INDEX_FILTER", "").strip() or os.environ["EVENTS"]
          effective_max_events = (
              os.environ.get("EVENTS_PER_SESSION_FOR_K50", "").strip()
              or os.environ.get("MAX_EVENTS", "").strip()
          )
          effective_nulls_per_event = int(
              os.environ.get("NULL_COUNT", "").strip()
              or os.environ["NULLS_PER_EVENT"]
          )
          output_dir = Path("results/spike-matched-event-window-null-plan")
          matrix = []
          total_events = 0
          for session in sessions:
              safe_session = session.replace("/", "_").replace("\\", "_")
              plan_path = output_dir / f"plan_{safe_session}.json"
              cmd = [
                  "python", "scripts/plan_model_evidence_event_shards.py",
                  "--dataset-root", os.environ["DATASET_ROOT"],
                  "--session", session,
                  "--events", events_spec,
                  "--event-shard-count", os.environ["EVENT_SHARD_COUNT"],
                  "--output", str(plan_path),
              ]
              if effective_max_events and not os.environ.get("EVENT_INDEX_FILTER", "").strip():
                  cmd.extend(["--max-events", effective_max_events])
              subprocess.run(cmd, check=True)
              plan = json.loads(plan_path.read_text(encoding="utf-8"))
              total_events += int(plan["event_count"])
              for shard in plan["event_matrix"]:
                  shard = dict(shard)
                  shard["session"] = session
                  shard["session_slug"] = safe_session
                  shard["global_shard_index"] = len(matrix)
                  matrix.append(shard)
          if len(matrix) > 256:
              raise SystemExit(f"Session/event matrix has {len(matrix)} jobs, exceeding GitHub Actions' 256-job matrix limit")
          all_plan = {
              "sessions": sessions,
              "events": events_spec,
              "max_events": effective_max_events or None,
              "nulls_per_event": effective_nulls_per_event,
              "comparison_scope": os.environ["COMPARISON_SCOPE"],
              "models": os.environ.get("NULL_MODELS", "").strip() or os.environ["MODELS"],
              "session_count": len(sessions),
              "event_count": total_events,
              "event_matrix": matrix,
          }
          (output_dir / "spike_matched_event_window_null_plan.json").write_text(json.dumps(all_plan, indent=2) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"event_matrix={json.dumps(matrix, separators=(',', ':'))}\n")
              output.write(f"event_count={total_events}\n")
              output.write(f"session_count={len(sessions)}\n")
          print(f"Planned {total_events} events across {len(sessions)} sessions and {len(matrix)} shards.")
          PY

      - name: Upload matched-null plan
        uses: actions/upload-artifact@v7
        with:
          name: spike-matched-event-window-null-plan-${{ github.run_id }}
          path: results/spike-matched-event-window-null-plan/
          if-no-files-found: error

  matched-null-shard:
    name: Matched-null ${{ matrix.event.session }} shard ${{ matrix.event.event_shard_index }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    needs: plan-session-event-shards
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        event: ${{ fromJson(needs.plan-session-event-shards.outputs.event_matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Ensure Pfeiffer-Foster dataset
        uses: ./.github/actions/ensure-pfeiffer-foster-dataset
        with:
          dataset-root: ${{ env.DATASET_ROOT }}
          session: ${{ matrix.event.session }}
          cache-key: hipporeplayimm-dataset-${{ runner.os }}-rclone-v1
          local-cache-root: ${{ env.LOCAL_CACHE_ROOT }}
          webdav-url: ${{ secrets.PFEIFFERFOSTER_WEBDAV_URL }}
          webdav-key: ${{ secrets.PFEIFFERFOSTER_DATA_KEY }}
          webdav-password: ${{ secrets.PFEIFFERFOSTER_DATA_PASSWORD }}

      - name: Run spike-matched null shard
        env:
          SHARD_SESSION: ${{ matrix.event.session }}
          SHARD_SESSION_SLUG: ${{ matrix.event.session_slug }}
          EVENT_SHARD_INDEX: ${{ matrix.event.event_shard_index }}
          SHARD_EVENTS: ${{ matrix.event.events_spec }}
        run: |
          set -euo pipefail
          out_dir="results/spike-matched-null-${SHARD_SESSION_SLUG}-shard-${EVENT_SHARD_INDEX}"
          models="${NULL_MODELS:-${MODELS}}"
          nulls_per_event="${NULL_COUNT:-${NULLS_PER_EVENT}}"
          python scripts/spike_matched_event_window_null.py score \
            --dataset-root "${DATASET_ROOT}" \
            --session "${SHARD_SESSION}" \
            --events "${SHARD_EVENTS}" \
            --models "${models}" \
            --comparison-scope "${COMPARISON_SCOPE}" \
            --nulls-per-event "${nulls_per_event}" \
            --spike-count-tolerance-fraction "${SPIKE_COUNT_TOLERANCE_FRACTION}" \
            --null-random-seed "${NULL_RANDOM_SEED}" \
            --output "${out_dir}" \
            --continue-on-error

      - name: Upload matched-null shard
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spike-matched-event-window-null-shard-${{ github.run_id }}-${{ matrix.event.global_shard_index }}
          path: results/spike-matched-null-${{ matrix.event.session_slug }}-shard-${{ matrix.event.event_shard_index }}/
          if-no-files-found: error

  aggregate:
    name: Aggregate spike-matched event-window nulls
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [plan-session-event-shards, matched-null-shard]
    if: ${{ always() && needs.plan-session-event-shards.result == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Download matched-null shards
        uses: actions/download-artifact@v7
        with:
          pattern: spike-matched-event-window-null-shard-${{ github.run_id }}-*
          path: artifacts/spike-matched-event-window-null-shards
          merge-multiple: false

      - name: Aggregate matched-null control
        run: |
          set -euo pipefail
          python scripts/spike_matched_event_window_null.py aggregate \
            --score-glob "artifacts/spike-matched-event-window-null-shards/**/matched_null_event_model_evidence.csv" \
            --output results/spike-matched-event-window-null \
            --comparison-scope "${COMPARISON_SCOPE}" \
            --bootstrap-seed "${NULL_RANDOM_SEED}" \
            --bootstrap-samples 2000
          for required_file in \
            matched_null_event_model_evidence.csv \
            matched_null_family_margin_decisions.csv \
            matched_null_family_margin_summary.csv \
            matched_null_empirical_p_values.csv \
            session_matched_null_summary.csv \
            rat_matched_null_summary.csv \
            leave_one_rat_out_matched_null_summary.csv \
            rat_bootstrap_matched_null_summary.csv \
            matched_null_control_gate_summary.csv \
            targeted_matched_null_session_diagnostics.csv \
            targeted_matched_null_event_diagnostics.csv \
            lightweight_matched_null_control_gate_summary.csv; do
            test -s "results/spike-matched-event-window-null/${required_file}" || {
              echo "Missing results/spike-matched-event-window-null/${required_file}" >&2
              exit 1
            }
          done

      - name: Show matched-null summary
        run: |
          python - <<'PY'
          import pandas as pd

          root = "results/spike-matched-event-window-null"
          print("Matched-null family-margin summary:")
          print(pd.read_csv(f"{root}/matched_null_family_margin_summary.csv").to_string(index=False))
          print("\nMatched-null empirical p-values:")
          print(pd.read_csv(f"{root}/matched_null_empirical_p_values.csv").to_string(index=False))
          print("\nMatched-null control gates:")
          print(pd.read_csv(f"{root}/matched_null_control_gate_summary.csv").to_string(index=False))
          PY

      - name: Upload matched-null control results
        uses: actions/upload-artifact@v7
        with:
          name: spike-matched-event-window-null-${{ github.run_id }}
          path: results/spike-matched-event-window-null/
          if-no-files-found: error
