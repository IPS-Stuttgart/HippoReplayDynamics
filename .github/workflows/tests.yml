name: Test workflow

permissions:
  contents: read
  checks: write

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [numpy, pytorch, jax]
        python-version: ["3.11", "3.12", "3.13"]
    permissions:
      checks: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install PyTorch backend dependencies
        if: ${{ matrix.backend == 'pytorch' }}
        run: |
          python -m pip install torch

      - name: Install JAX backend dependencies
        if: ${{ matrix.backend == 'jax' }}
        run: |
          python -m pip install "jax[cpu]" autograd

      - name: Run tests
        run: |
          python -m pytest --rootdir . -v --strict-config --junitxml=junit_test_results_${{ matrix.backend }}_${{ matrix.python-version }}.xml ./tests
        env:
          PYRECEST_BACKEND: ${{ matrix.backend }}
          PYTHONPATH: ${{ github.workspace }}/src

      - name: Upload test result artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.backend }}-${{ matrix.python-version }}-test-results
          path: junit_test_results_${{ matrix.backend }}_${{ matrix.python-version }}.xml
          if-no-files-found: ignore

  publish-results:
    needs: test
    runs-on: ubuntu-latest
    if: always()
    permissions:
      checks: write
      pull-requests: write
    steps:
      - name: Download all test result artifacts
        uses: actions/download-artifact@v8
        with:
          path: test-results

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: |
            test-results/*/junit_test_results_*.xml
