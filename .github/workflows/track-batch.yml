---
name: Track Pfeiffer-Foster replay batch

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  DATASET_ROOT: data/DataSetFromPfeifferFoster
  SESSION: Rat1/Open1
  EVENTS: 0-25
  MODELS: stationary diffusion momentum imm
  CANDIDATE_TOP_K: "64"
  PYRECEST_PARTICLES: "512"
  TIME_BIN_S: "0.02"

jobs:
  track-batch:
    name: Track replay batch
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Ensure Pfeiffer-Foster dataset
        id: dataset
        uses: ./.github/actions/ensure-pfeiffer-foster-dataset
        with:
          dataset-root: ${{ env.DATASET_ROOT }}
          session: ${{ env.SESSION }}
          cache-key: hipporeplayimm-dataset-${{ runner.os }}-rclone-v1
          webdav-url: ${{ secrets.PFEIFFERFOSTER_WEBDAV_URL }}
          webdav-key: ${{ secrets.PFEIFFERFOSTER_DATA_KEY }}
          webdav-password: ${{ secrets.PFEIFFERFOSTER_DATA_PASSWORD }}

      - name: Track replay batch
        run: |
          python scripts/track_batch.py \
            --dataset-root "${DATASET_ROOT}" \
            --session "${SESSION}" \
            --events "${EVENTS}" \
            --models ${MODELS} \
            --candidate-top-k "${CANDIDATE_TOP_K}" \
            --pyrecest-particles "${PYRECEST_PARTICLES}" \
            --time-bin-s "${TIME_BIN_S}" \
            --output results/track-batch \
            --continue-on-error

      - name: Show batch summary
        if: always()
        run: |
          if [ -f results/track-batch/batch_summary.csv ]; then
            python - <<'PY'
          import pandas as pd
          df = pd.read_csv('results/track-batch/batch_summary.csv')
          print(df.head(20).to_string(index=False))
          print('\nRows:', len(df))
          print('Failures:', int((df['status'] == 'failure').sum()))
          PY
          else
            echo "No batch summary was generated."
          fi

      - name: Upload batch tracking results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: replay-track-batch-rat1-open1-events-0-25
          path: results/track-batch/
          if-no-files-found: error
