---
name: Track Pfeiffer-Foster replay event

on:
  workflow_dispatch:
    inputs:
      dataset-root:
        description: "Dataset path after extraction"
        required: true
        default: "data/DataSetFromPfeifferFoster"
      session:
        description: "Session ID, e.g. Rat1/Open1"
        required: true
        default: "Rat1/Open1"
      event-id:
        description: "Ripple event index"
        required: true
        default: "0"
      model:
        description: "Replay model"
        required: true
        type: choice
        default: "imm"
        options:
          - random
          - stationary
          - diffusion
          - momentum
          - imm
          - pyrecest-goal-particle
          - pyrecest-goal-particle-imm
      candidate-top-k:
        description: "Candidate spatial bins per time bin"
        required: true
        default: "64"
      pyrecest-particles:
        description: "Particle count for PyRecEst-backed models"
        required: true
        default: "512"
      time-bin-s:
        description: "Ripple decoding time-bin width in seconds"
        required: true
        default: "0.02"

permissions:
  contents: read

jobs:
  track-event:
    name: Track replay event
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Download dataset
        env:
          DATA_FULL_URL: ${{ secrets.DATA_FULL_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DATA_FULL_URL}" ]; then
            echo "Repository secret DATA_FULL_URL is not set." >&2
            exit 1
          fi
          mkdir -p data
          curl --fail --location --show-error --silent "${DATA_FULL_URL%/}/download" --output data/dataset.zip
          unzip -q data/dataset.zip -d data
          find data -maxdepth 3 -type d | sort | sed -n '1,80p'

      - name: Inspect sessions
        run: |
          hipporeplayimm inspect "${{ inputs.dataset-root }}"

      - name: Track replay event
        run: |
          python scripts/track_event.py \
            --dataset-root "${{ inputs.dataset-root }}" \
            --session "${{ inputs.session }}" \
            --event-id "${{ inputs.event-id }}" \
            --model "${{ inputs.model }}" \
            --candidate-top-k "${{ inputs.candidate-top-k }}" \
            --pyrecest-particles "${{ inputs.pyrecest-particles }}" \
            --time-bin-s "${{ inputs.time-bin-s }}" \
            --output results/tracks

      - name: Upload tracking results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: replay-track-${{ inputs.event-id }}-${{ inputs.model }}
          path: results/tracks/
          if-no-files-found: error
