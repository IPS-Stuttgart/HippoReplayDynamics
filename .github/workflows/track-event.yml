---
name: Track Pfeiffer-Foster replay event

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  DATASET_ROOT: data/DataSetFromPfeifferFoster
  SESSION: Rat1/Open1
  EVENT_ID: "0"
  MODEL: imm
  CANDIDATE_TOP_K: "64"
  PYRECEST_PARTICLES: "512"
  TIME_BIN_S: "0.02"

jobs:
  track-event:
    name: Track replay event
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Download dataset
        env:
          DATA_FULL_URL: ${{ secrets.DATA_FULL_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DATA_FULL_URL}" ]; then
            echo "Repository secret DATA_FULL_URL is not set." >&2
            exit 1
          fi
          mkdir -p data
          curl --fail --location --show-error --silent "${DATA_FULL_URL%/}/download" --output data/dataset.zip
          unzip -q data/dataset.zip -d data
          find data -maxdepth 3 -type d | sort | sed -n '1,80p'

      - name: Inspect sessions
        run: |
          hipporeplayimm inspect "${DATASET_ROOT}"

      - name: Track replay event
        run: |
          python scripts/track_event.py \
            --dataset-root "${DATASET_ROOT}" \
            --session "${SESSION}" \
            --event-id "${EVENT_ID}" \
            --model "${MODEL}" \
            --candidate-top-k "${CANDIDATE_TOP_K}" \
            --pyrecest-particles "${PYRECEST_PARTICLES}" \
            --time-bin-s "${TIME_BIN_S}" \
            --output results/tracks

      - name: Upload tracking results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: replay-track-${{ env.EVENT_ID }}-${{ env.MODEL }}
          path: results/tracks/
          if-no-files-found: error
