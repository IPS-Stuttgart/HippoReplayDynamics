---
name: Track Pfeiffer-Foster replay event

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  DATASET_ROOT: data/DataSetFromPfeifferFoster
  SESSION: Rat1/Open1
  EVENT_ID: "0"
  MODEL: imm
  CANDIDATE_TOP_K: "64"
  PYRECEST_PARTICLES: "512"
  TIME_BIN_S: "0.02"

jobs:
  track-event:
    name: Track replay event
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Restore dataset cache
        id: dataset-cache
        uses: actions/cache/restore@v5
        with:
          path: data/dataset.zip
          key: hipporeplayimm-dataset-${{ runner.os }}-v1

      - name: Download dataset
        if: ${{ steps.dataset-cache.outputs.cache-hit != 'true' }}
        env:
          DATA_FULL_URL: ${{ secrets.DATA_FULL_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DATA_FULL_URL}" ]; then
            echo "Repository secret DATA_FULL_URL is not set." >&2
            exit 1
          fi
          mkdir -p data
          curl --fail --location --show-error --silent "${DATA_FULL_URL%/}/download" --output data/dataset.zip

      - name: Save dataset cache
        if: ${{ steps.dataset-cache.outputs.cache-hit != 'true' && hashFiles('data/dataset.zip') != '' }}
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: data/dataset.zip
          key: ${{ steps.dataset-cache.outputs.cache-primary-key }}

      - name: Extract dataset
        run: |
          set -euo pipefail
          mkdir -p data
          unzip -q data/dataset.zip -d data
          find data -maxdepth 3 -type d | sort | sed -n '1,80p'

      - name: Check requested session
        run: |
          set -euo pipefail
          session_dir="${DATASET_ROOT}/${SESSION}"
          echo "Checking requested session directory: ${session_dir}"
          test -d "${session_dir}"
          for required_file in Position_Data.mat Ripple_Events.mat Spike_Data.mat Epochs.mat; do
            test -f "${session_dir}/${required_file}" || {
              echo "Missing ${session_dir}/${required_file}" >&2
              exit 1
            }
          done
          find "${session_dir}" -maxdepth 1 -type f | sort

      - name: Track replay event
        run: |
          python scripts/track_event.py \
            --dataset-root "${DATASET_ROOT}" \
            --session "${SESSION}" \
            --event-id "${EVENT_ID}" \
            --model "${MODEL}" \
            --candidate-top-k "${CANDIDATE_TOP_K}" \
            --pyrecest-particles "${PYRECEST_PARTICLES}" \
            --time-bin-s "${TIME_BIN_S}" \
            --output results/tracks

      - name: Upload tracking results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: replay-track-${{ env.EVENT_ID }}-${{ env.MODEL }}
          path: results/tracks/
          if-no-files-found: error
