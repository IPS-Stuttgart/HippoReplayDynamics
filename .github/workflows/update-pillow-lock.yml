---
name: Update Pillow lock

"on":
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Poetry
        run: python -m pip install --quiet "poetry>=2,<3"
      - name: Update Pillow only
        run: |
          poetry update pillow --lock
          poetry show pillow
      - name: Upload updated lock
        uses: actions/upload-artifact@v7
        with:
          name: pillow-12.3.0-lock
          path: poetry.lock
