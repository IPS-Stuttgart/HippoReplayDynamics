---
name: Update Pillow lock

"on":
  push:
    branches: [security/pillow-12.3.0-20260714]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: security/pillow-12.3.0-20260714
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Generate security lock update
        run: |
          python -m pip install --quiet "poetry>=2,<3"
          poetry update pillow --lock
          poetry show pillow | grep -F "12.3.0"
          rm .github/workflows/update-pillow-lock.yml
      - name: Commit lockfile-only update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add poetry.lock .github/workflows/update-pillow-lock.yml
          git commit -m "Update Pillow lock to 12.3.0"
          git push origin HEAD:security/pillow-12.3.0-20260714
