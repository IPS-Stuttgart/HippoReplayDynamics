---
name: Wrong-map replay evidence controls

on:
  workflow_dispatch:
    inputs:
      dataset_root:
        description: "Dataset path after download or cache restore"
        required: true
        default: "data/DataSetFromPfeifferFoster"
      session_map_pairs:
        description: "Space- or comma-separated EVENT=MAP session pairs"
        required: true
        default: "Rat1/Open1=Rat1/Open2 Rat1/Open2=Rat1/Open1 Rat2/Open1=Rat2/Open2 Rat2/Open2=Rat2/Open1 Rat3/Open1=Rat3/Open2 Rat3/Open2=Rat3/Open1 Rat4/Open1=Rat4/Open2 Rat4/Open2=Rat4/Open1"
      events:
        description: "Event IDs/ranges, all, run, or run:0-25"
        required: true
        default: "run"
      max_events:
        description: "Maximum selected events per event session; empty means no cap"
        required: false
        default: ""
      real_evidence_run_id:
        description: "Optional real-map model-evidence run ID to compare against wrong-map controls"
        required: false
        default: ""
      real_evidence_artifact_name:
        description: "Artifact name from the real-map run; required when real_evidence_run_id is set"
        required: false
        default: ""
      models:
        description: "Space-separated models"
        required: true
        default: "sorted-spike-state-space-stationary sorted-spike-state-space-diffusion sorted-spike-state-space-fragmented sorted-spike-state-space-first-order-imm sorted-spike-state-space-momentum-exact-sparse sorted-spike-state-space-momentum sorted-spike-state-space-imm"
      event_shard_count:
        description: "Target event shards per event session"
        required: true
        default: "16"
      candidate_top_k:
        description: "Candidate spatial bins per time bin for candidate-pruned models"
        required: true
        default: "64"
      state_space_stationary_sigma_cm:
        description: "State-space stationary transition sigma in cm"
        required: true
        default: "2.0"
      state_space_diffusion_sigma_cm_sqrt_s:
        description: "State-space diffusion noise in cm/sqrt(s)"
        required: true
        default: "60.0"
      state_space_max_step_sigma:
        description: "State-space Gaussian transition truncation radius in sigmas"
        required: true
        default: "3.0"
      state_space_valid_occupancy_threshold_s:
        description: "Minimum run occupancy in seconds for valid state-space bins; 0 keeps the full grid"
        required: true
        default: "0.0"
      state_space_imm_mode_stickiness:
        description: "State-space IMM mode-transition stickiness"
        required: true
        default: "0.95"
      state_space_momentum_sigma_cm_sqrt_s:
        description: "State-space momentum process noise in cm/sqrt(s)"
        required: true
        default: "50.0"
      state_space_momentum_initial_sigma_cm_sqrt_s:
        description: "State-space initial momentum process noise in cm/sqrt(s)"
        required: true
        default: "45.0"
      state_space_momentum_velocity_decay:
        description: "State-space momentum velocity decay"
        required: true
        default: "0.93"
      time_bin_s:
        description: "Ripple decoding time-bin width in seconds"
        required: true
        default: "0.004"
      spike_rate_scale:
        description: "Multiplicative scale applied to Poisson place-field rates during ripple scoring"
        required: true
        default: "2.0"
      emission_likelihood_temperature:
        description: "Sorted-spike emission likelihood temperature"
        required: true
        default: "0.300"
      emission_negative_binomial_overdispersion:
        description: "Sorted-spike negative-binomial overdispersion; 0 keeps Poisson emissions"
        required: true
        default: "0.0"
      bin_size_cm:
        description: "Place-field spatial bin size in centimeters"
        required: true
        default: "6.0"
      smoothing_sigma_bins:
        description: "Place-field smoothing sigma in spatial bins"
        required: true
        default: "2.0"
      min_speed_cm_s:
        description: "Minimum speed for place-field training in cm/s"
        required: true
        default: "5.0"

permissions:
  contents: read

concurrency:
  group: wrong-map-evidence-controls-${{ github.repository }}-${{ inputs.session_map_pairs }}-${{ inputs.events }}-${{ inputs.max_events }}-${{ inputs.spike_rate_scale }}-${{ inputs.emission_likelihood_temperature }}-${{ inputs.state_space_momentum_initial_sigma_cm_sqrt_s }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DATASET_ROOT: ${{ inputs.dataset_root }}
  SESSION_MAP_PAIRS: ${{ inputs.session_map_pairs }}
  EVENTS: ${{ inputs.events }}
  MAX_EVENTS: ${{ inputs.max_events }}
  REAL_EVIDENCE_RUN_ID: ${{ inputs.real_evidence_run_id }}
  REAL_EVIDENCE_ARTIFACT_NAME: ${{ inputs.real_evidence_artifact_name }}
  MODELS: ${{ inputs.models }}
  EVENT_SHARD_COUNT: ${{ inputs.event_shard_count }}
  CANDIDATE_TOP_K: ${{ inputs.candidate_top_k }}
  STATE_SPACE_STATIONARY_SIGMA_CM: ${{ inputs.state_space_stationary_sigma_cm }}
  STATE_SPACE_DIFFUSION_SIGMA_CM_SQRT_S: ${{ inputs.state_space_diffusion_sigma_cm_sqrt_s }}
  STATE_SPACE_MAX_STEP_SIGMA: ${{ inputs.state_space_max_step_sigma }}
  STATE_SPACE_VALID_OCCUPANCY_THRESHOLD_S: ${{ inputs.state_space_valid_occupancy_threshold_s }}
  STATE_SPACE_IMM_MODE_STICKINESS: ${{ inputs.state_space_imm_mode_stickiness }}
  STATE_SPACE_MOMENTUM_SIGMA_CM_SQRT_S: ${{ inputs.state_space_momentum_sigma_cm_sqrt_s }}
  STATE_SPACE_MOMENTUM_INITIAL_SIGMA_CM_SQRT_S: ${{ inputs.state_space_momentum_initial_sigma_cm_sqrt_s }}
  STATE_SPACE_MOMENTUM_VELOCITY_DECAY: ${{ inputs.state_space_momentum_velocity_decay }}
  STATE_SPACE_MOMENTUM_CANDIDATE_TOP_K: "128"
  STATE_SPACE_MOMENTUM_PREDICTED_CANDIDATE_TOP_K: "8"
  STATE_SPACE_MOMENTUM_CANDIDATE_SOURCE: "emission"
  CLUSTERLESS_MARK_SMOOTHING_SIGMA_BINS: "1.0"
  CLUSTERLESS_MARK_PRIOR_COUNT: "1.0"
  CLUSTERLESS_MARK_VARIANCE_FLOOR: "1.0"
  CLUSTERLESS_RATE_FLOOR_HZ: "0.0001"
  CLUSTERLESS_MARK_LIKELIHOOD: "local-kde"
  TIME_BIN_S: ${{ inputs.time_bin_s }}
  SPIKE_RATE_SCALE: ${{ inputs.spike_rate_scale }}
  EMISSION_LIKELIHOOD_TEMPERATURE: ${{ inputs.emission_likelihood_temperature }}
  EMISSION_NEGATIVE_BINOMIAL_OVERDISPERSION: ${{ inputs.emission_negative_binomial_overdispersion }}
  BIN_SIZE_CM: ${{ inputs.bin_size_cm }}
  SMOOTHING_SIGMA_BINS: ${{ inputs.smoothing_sigma_bins }}
  MIN_SPEED_CM_S: ${{ inputs.min_speed_cm_s }}
  LOCAL_CACHE_ROOT: ${{ vars.PFEIFFERFOSTER_LOCAL_CACHE_ROOT }}
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  plan-session-event-shards:
    name: Plan wrong-map event shards
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      event_matrix: ${{ steps.plan.outputs.event_matrix }}
      event_count: ${{ steps.plan.outputs.event_count }}
      pair_count: ${{ steps.plan.outputs.pair_count }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Ensure Pfeiffer-Foster dataset
        uses: ./.github/actions/ensure-pfeiffer-foster-dataset
        with:
          dataset-root: ${{ env.DATASET_ROOT }}
          session: Rat1/Open1
          cache-key: hipporeplayimm-dataset-${{ runner.os }}-rclone-v1
          local-cache-root: ${{ env.LOCAL_CACHE_ROOT }}
          webdav-url: ${{ secrets.PFEIFFERFOSTER_WEBDAV_URL }}
          webdav-key: ${{ secrets.PFEIFFERFOSTER_DATA_KEY }}
          webdav-password: ${{ secrets.PFEIFFERFOSTER_DATA_PASSWORD }}

      - name: Plan wrong-map session/event shards
        id: plan
        run: |
          set -euo pipefail
          mkdir -p results/wrong-map-evidence-control-plan
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          def slug(value: str) -> str:
              return value.replace("/", "_").replace("\\", "_")

          pairs = []
          for item in re.split(r"[\s,]+", os.environ["SESSION_MAP_PAIRS"].strip()):
              if not item:
                  continue
              if "=" not in item:
                  raise SystemExit(f"Invalid session_map_pairs item {item!r}; expected EVENT=MAP")
              event_session, map_session = item.split("=", 1)
              if not event_session or not map_session:
                  raise SystemExit(f"Invalid session_map_pairs item {item!r}; expected EVENT=MAP")
              pairs.append((event_session, map_session))
          if not pairs:
              raise SystemExit("No session/map pairs selected")

          output_dir = Path("results/wrong-map-evidence-control-plan")
          matrix = []
          total_events = 0
          for event_session, map_session in pairs:
              safe_session = slug(event_session)
              plan_path = output_dir / f"plan_{safe_session}.json"
              cmd = [
                  "python", "scripts/plan_model_evidence_event_shards.py",
                  "--dataset-root", os.environ["DATASET_ROOT"],
                  "--session", event_session,
                  "--events", os.environ["EVENTS"],
                  "--event-shard-count", os.environ["EVENT_SHARD_COUNT"],
                  "--output", str(plan_path),
              ]
              if os.environ.get("MAX_EVENTS"):
                  cmd.extend(["--max-events", os.environ["MAX_EVENTS"]])
              subprocess.run(cmd, check=True)
              plan = json.loads(plan_path.read_text(encoding="utf-8"))
              total_events += int(plan["event_count"])
              for shard in plan["event_matrix"]:
                  shard = dict(shard)
                  shard["session"] = event_session
                  shard["map_session"] = map_session
                  shard["session_slug"] = safe_session
                  shard["map_session_slug"] = slug(map_session)
                  shard["global_shard_index"] = len(matrix)
                  matrix.append(shard)
          if len(matrix) > 256:
              raise SystemExit(f"Wrong-map matrix has {len(matrix)} jobs, exceeding GitHub Actions' 256-job matrix limit")
          all_plan = {
              "session_map_pairs": [{"event_session": a, "map_session": b} for a, b in pairs],
              "events": os.environ["EVENTS"],
              "max_events": os.environ.get("MAX_EVENTS") or None,
              "pair_count": len(pairs),
              "event_count": total_events,
              "event_matrix": matrix,
          }
          (output_dir / "wrong_map_event_plan.json").write_text(json.dumps(all_plan, indent=2) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"event_matrix={json.dumps(matrix, separators=(',', ':'))}\n")
              output.write(f"event_count={total_events}\n")
              output.write(f"pair_count={len(pairs)}\n")
          print(f"Planned {total_events} events across {len(pairs)} session/map pairs and {len(matrix)} shards.")
          PY

      - name: Upload wrong-map event-shard plan
        uses: actions/upload-artifact@v7
        with:
          name: wrong-map-evidence-control-plan-${{ github.run_id }}
          path: results/wrong-map-evidence-control-plan/
          if-no-files-found: error

  wrong-map-evidence-shard:
    name: Wrong-map ${{ matrix.event.session }} using ${{ matrix.event.map_session }} shard ${{ matrix.event.event_shard_index }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: plan-session-event-shards
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        event: ${{ fromJson(needs.plan-session-event-shards.outputs.event_matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Ensure Pfeiffer-Foster event-session data
        uses: ./.github/actions/ensure-pfeiffer-foster-dataset
        with:
          dataset-root: ${{ env.DATASET_ROOT }}
          session: ${{ matrix.event.session }}
          cache-key: hipporeplayimm-dataset-${{ runner.os }}-rclone-v1
          local-cache-root: ${{ env.LOCAL_CACHE_ROOT }}
          webdav-url: ${{ secrets.PFEIFFERFOSTER_WEBDAV_URL }}
          webdav-key: ${{ secrets.PFEIFFERFOSTER_DATA_KEY }}
          webdav-password: ${{ secrets.PFEIFFERFOSTER_DATA_PASSWORD }}

      - name: Ensure Pfeiffer-Foster map-session data
        uses: ./.github/actions/ensure-pfeiffer-foster-dataset
        with:
          dataset-root: ${{ env.DATASET_ROOT }}
          session: ${{ matrix.event.map_session }}
          cache-key: hipporeplayimm-dataset-${{ runner.os }}-rclone-v1
          local-cache-root: ${{ env.LOCAL_CACHE_ROOT }}
          webdav-url: ${{ secrets.PFEIFFERFOSTER_WEBDAV_URL }}
          webdav-key: ${{ secrets.PFEIFFERFOSTER_DATA_KEY }}
          webdav-password: ${{ secrets.PFEIFFERFOSTER_DATA_PASSWORD }}

      - name: Run wrong-map evidence control shard
        env:
          SHARD_SESSION: ${{ matrix.event.session }}
          SHARD_MAP_SESSION: ${{ matrix.event.map_session }}
          SHARD_SESSION_SLUG: ${{ matrix.event.session_slug }}
          SHARD_MAP_SESSION_SLUG: ${{ matrix.event.map_session_slug }}
          EVENT_SHARD_INDEX: ${{ matrix.event.event_shard_index }}
          GLOBAL_SHARD_INDEX: ${{ matrix.event.global_shard_index }}
          SHARD_EVENTS: ${{ matrix.event.events_spec }}
        run: |
          set -euo pipefail
          out_dir="results/wrong-map-${SHARD_SESSION_SLUG}-using-${SHARD_MAP_SESSION_SLUG}-shard-${EVENT_SHARD_INDEX}"
          python scripts/wrong_map_evidence_controls.py \
            --dataset-root "${DATASET_ROOT}" \
            --event-session "${SHARD_SESSION}" \
            --map-session "${SHARD_MAP_SESSION}" \
            --events "${SHARD_EVENTS}" \
            --models "${MODELS}" \
            --candidate-top-k "${CANDIDATE_TOP_K}" \
            --state-space-stationary-sigma-cm "${STATE_SPACE_STATIONARY_SIGMA_CM}" \
            --state-space-diffusion-sigma-cm-sqrt-s "${STATE_SPACE_DIFFUSION_SIGMA_CM_SQRT_S}" \
            --state-space-max-step-sigma "${STATE_SPACE_MAX_STEP_SIGMA}" \
            --state-space-valid-occupancy-threshold-s "${STATE_SPACE_VALID_OCCUPANCY_THRESHOLD_S}" \
            --state-space-imm-mode-stickiness "${STATE_SPACE_IMM_MODE_STICKINESS}" \
            --state-space-momentum-sigma-cm-sqrt-s "${STATE_SPACE_MOMENTUM_SIGMA_CM_SQRT_S}" \
            --state-space-momentum-initial-sigma-cm-sqrt-s "${STATE_SPACE_MOMENTUM_INITIAL_SIGMA_CM_SQRT_S}" \
            --state-space-momentum-velocity-decay "${STATE_SPACE_MOMENTUM_VELOCITY_DECAY}" \
            --state-space-momentum-candidate-top-k "${STATE_SPACE_MOMENTUM_CANDIDATE_TOP_K}" \
            --state-space-momentum-predicted-candidate-top-k "${STATE_SPACE_MOMENTUM_PREDICTED_CANDIDATE_TOP_K}" \
            --state-space-momentum-candidate-source "${STATE_SPACE_MOMENTUM_CANDIDATE_SOURCE}" \
            --clusterless-mark-smoothing-sigma-bins "${CLUSTERLESS_MARK_SMOOTHING_SIGMA_BINS}" \
            --clusterless-mark-prior-count "${CLUSTERLESS_MARK_PRIOR_COUNT}" \
            --clusterless-mark-variance-floor "${CLUSTERLESS_MARK_VARIANCE_FLOOR}" \
            --clusterless-rate-floor-hz "${CLUSTERLESS_RATE_FLOOR_HZ}" \
            --clusterless-mark-likelihood "${CLUSTERLESS_MARK_LIKELIHOOD}" \
            --time-bin-s "${TIME_BIN_S}" \
            --spike-rate-scale "${SPIKE_RATE_SCALE}" \
            --emission-likelihood-temperature "${EMISSION_LIKELIHOOD_TEMPERATURE}" \
            --emission-negative-binomial-overdispersion "${EMISSION_NEGATIVE_BINOMIAL_OVERDISPERSION}" \
            --bin-size-cm "${BIN_SIZE_CM}" \
            --smoothing-sigma-bins "${SMOOTHING_SIGMA_BINS}" \
            --min-speed-cm-s "${MIN_SPEED_CM_S}" \
            --output "${out_dir}" \
            --continue-on-error

      - name: Upload wrong-map evidence shard
        uses: actions/upload-artifact@v7
        with:
          name: wrong-map-evidence-control-shard-${{ github.run_id }}-${{ matrix.event.global_shard_index }}
          path: results/wrong-map-${{ matrix.event.session_slug }}-using-${{ matrix.event.map_session_slug }}-shard-${{ matrix.event.event_shard_index }}/
          if-no-files-found: error

  aggregate:
    name: Aggregate wrong-map evidence controls
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [plan-session-event-shards, wrong-map-evidence-shard]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install aggregate dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas

      - name: Download wrong-map evidence shards
        uses: actions/download-artifact@v7
        with:
          pattern: wrong-map-evidence-control-shard-${{ github.run_id }}-*
          path: artifacts/wrong-map-evidence-control-shards

      - name: Download real-map reference artifact
        if: ${{ inputs.real_evidence_run_id != '' }}
        uses: actions/download-artifact@v7
        with:
          run-id: ${{ inputs.real_evidence_run_id }}
          name: ${{ inputs.real_evidence_artifact_name }}
          path: artifacts/real-map-evidence
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}

      - name: Aggregate wrong-map evidence controls
        env:
          EXPECTED_EVENTS: ${{ needs.plan-session-event-shards.outputs.event_count }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          import pandas as pd

          paths = sorted(Path("artifacts/wrong-map-evidence-control-shards").glob("**/event_model_evidence.csv"))
          if not paths:
              raise SystemExit("No wrong-map event_model_evidence.csv shards found")
          frames = [pd.read_csv(path) for path in paths]
          frame = pd.concat(frames, ignore_index=True)
          out = Path("results/wrong-map-evidence-controls")
          out.mkdir(parents=True, exist_ok=True)
          frame.to_csv(out / "event_model_evidence.csv", index=False)
          frame.to_csv(out / "all_sessions_wrong_map_event_model_evidence.csv", index=False)

          expected_events = int(os.environ["EXPECTED_EVENTS"])
          expected_models = len(os.environ["MODELS"].split())
          observed_events = int(frame[["session", "event_index", "map_session"]].drop_duplicates().shape[0])
          expected_rows = expected_events * expected_models
          if observed_events != expected_events:
              raise SystemExit(f"Expected {expected_events} session-events, observed {observed_events}")
          if len(frame) != expected_rows:
              raise SystemExit(f"Expected {expected_rows} rows, observed {len(frame)}")
          failures = int((frame.get("status", "success") != "success").sum())
          if failures:
              failed = frame[frame["status"] != "success"][["session", "event_index", "map_session", "model", "error"]]
              failed.to_csv(out / "wrong_map_failures.csv", index=False)
              raise SystemExit(f"Wrong-map evidence contains {failures} failed rows")

          summary = (
              frame.groupby(["model", "map_session"], dropna=False)
              .agg(
                  events=("event_index", "nunique"),
                  mean_log_evidence=("log_evidence", "mean"),
                  median_log_evidence=("log_evidence", "median"),
                  mean_runtime_s=("runtime_s", "mean"),
              )
              .reset_index()
          )
          summary.to_csv(out / "wrong_map_model_summary.csv", index=False)
          best = (
              frame.sort_values("log_evidence", ascending=False)
              .drop_duplicates(["session", "event_index", "map_session"], keep="first")
              .groupby("model")
              .size()
              .reset_index(name="wrong_map_best_events")
              .sort_values("wrong_map_best_events", ascending=False)
          )
          best.to_csv(out / "wrong_map_best_model_counts.csv", index=False)
          print(f"Validated {len(frame)} rows across {observed_events} wrong-map session-events and {expected_models} models.")
          print("Wrong-map best-model counts:")
          print(best.to_string(index=False))
          PY

      - name: Compare wrong-map evidence against real-map reference
        if: ${{ inputs.real_evidence_run_id != '' }}
        run: |
          set -euo pipefail
          if [ -z "${REAL_EVIDENCE_ARTIFACT_NAME}" ]; then
            echo "real_evidence_artifact_name is required when real_evidence_run_id is set" >&2
            exit 1
          fi
          real_csv="$(find artifacts/real-map-evidence -name all_sessions_event_model_evidence.csv -print -quit)"
          if [ -z "${real_csv}" ]; then
            real_csv="$(find artifacts/real-map-evidence -name event_model_evidence.csv -print -quit)"
          fi
          if [ -z "${real_csv}" ]; then
            echo "Could not find real-map event evidence CSV in downloaded artifact" >&2
            find artifacts/real-map-evidence -maxdepth 3 -type f | sort >&2 || true
            exit 1
          fi
          python scripts/compare_wrong_map_evidence_controls.py \
            --real-event-model-evidence "${real_csv}" \
            --wrong-map-event-model-evidence results/wrong-map-evidence-controls/all_sessions_wrong_map_event_model_evidence.csv \
            --margin-threshold 5.5 \
            --output results/wrong-map-evidence-controls
          test -s results/wrong-map-evidence-controls/wrong_map_model_evidence_attenuation.csv
          test -s results/wrong-map-evidence-controls/wrong_map_family_evidence_attenuation_summary.csv
          test -s results/wrong-map-evidence-controls/wrong_map_control_gate_summary.csv

      - name: Upload wrong-map evidence control results
        uses: actions/upload-artifact@v7
        with:
          name: wrong-map-evidence-controls-${{ github.run_id }}
          path: results/wrong-map-evidence-controls/
          if-no-files-found: error
