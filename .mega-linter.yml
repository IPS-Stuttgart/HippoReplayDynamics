APPLY_FIXES: all
PRINT_ALPACA: false
SHOW_ELAPSED_TIME: true

DISABLE_LINTERS:
  - SPELL_CSPELL
  - COPYPASTE_JSCPD
  - PYTHON_BANDIT
  - PYTHON_BLACK
  - PYTHON_FLAKE8
  - PYTHON_ISORT
  - PYTHON_MYPY
  - PYTHON_PYRIGHT
  - PYTHON_PYLINT
  - REPOSITORY_DEVSKIM
  - REPOSITORY_TRIVY
  - JSON_JSONLINT
  - MAKEFILE_CHECKMAKE
  - SPELL_LYCHEE
  - REPOSITORY_GRYPE
  # MegaLinter regenerates megalinter-reports/* during the run. Some of those
  # generated SBOM files contain alignment whitespace, so git_diff can fail on
  # report artifacts even when source linters passed. Source-level diff checks
  # remain covered by the dedicated static CI job.
  - REPOSITORY_GIT_DIFF

FILTER_REGEX_EXCLUDE: '(^\.github/workflows/|^megalinter-reports/)'