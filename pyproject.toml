[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hipporeplayimm"
version = "0.1.0"
description = "IMM and state-space replay benchmarks for Pfeiffer/Foster hippocampal open-field data"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "beartype",
    "numpy",
    "scipy",
    "h5py",
    "pandas",
    "matplotlib",
]

[project.optional-dependencies]
pyrecest = ["pyrecest @ git+https://github.com/FlorianPfaff/PyRecEst.git@main"]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]
dev-pyrecest = [
    "pytest>=8",
    "ruff>=0.8",
    "pyrecest @ git+https://github.com/FlorianPfaff/PyRecEst.git@main",
]

[project.scripts]
hipporeplayimm = "hipporeplayimm.cli:main"

[project.urls]
Repository = "https://github.com/IPS-Stuttgart/HippoReplayIMM"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
check_untyped_defs = true

[tool.ruff]
line-length = 180

[tool.ruff.lint]
extend-ignore = ["E402", "E701", "E702", "F811"]

[tool.isort]
profile = "black"

[tool.pylint.MAIN]
py-version = "3.13"
fail-under = 10
ignore = ["CVS"]
ignored-modules = ["pyrecest.backend", "healpy"]

[tool.pylint."MESSAGES CONTROL"]
disable = [
    "raw-checker-failed",
    "bad-inline-option",
    "locally-disabled",
    "file-ignored",
    "suppressed-message",
    "deprecated-pragma",
    "use-symbolic-message-instead",
    "C",
    "W0221",
    "redefined-builtin",
    "cyclic-import",
]

[tool.pylint.FORMAT]
max-line-length = 180

[tool.pylint.DESIGN]
max-args = 6
max-parents = 15
max-public-methods = 25
min-public-methods = 0

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"
